# Site Configuration
# To use this example site, copy the content of this file to your root hugo.yaml or hugo.toml file.
# You may need to adjust the "theme" setting if your theme is installed in a different location.
baseURL: "/"
locale: en-GB
title: Hugo Air Theme Demo


# Site Parameters
params:
  author:
    name: François
    siteUrl: https://fducat18.github.io/hugo-air-demo/
  osm_url: https://www.openstreetmap.org/export/embed.html?bbox=-2.4050%2C46.6980%2C-2.3350%2C46.7320&layer=mapnik&marker=46.7141%2C-2.3681
  osm_markers:
    - title: "Quartier Libre"
      lat: 50.643936
      lon: 3.050444
      description: "Espace convivial & culturel au bord de la Deûle — Lille"
      link: "https://www.openstreetmap.org/search?lat=50.643936&lon=3.050444"
    - title: "Le p'tit quinquin"
      lat: 50.637125
      lon: 3.039490
      description: "Statue et symbole lillois — Square Foch, Lille"
      link: "https://www.openstreetmap.org/search?lat=50.637125&lon=3.039490"
  gmaps_url: https://tinyurl.com/mr3uesbx
  mainColor: "#035c8c"
  footer: "Hugo Air Theme is a great responsive theme!"

# Multi-language support
defaultContentLanguage: fr
languages:
  en:
    locale: en-GB
    contentDir: content/en
    label: English
    weight: 1
    menu:
      main:
      - name: Home 
        pageRef: /
        weight: 20
      - name: Features
        pageRef: /features
        weight: 30
      - name: Shortcode Gallery
        pageRef: /features/shortcode-gallery/
        parent: Features
        weight: 20
      - name: Page Type Gallery
        pageRef: /features/gallery-page-type
        parent: Features
        weight: 30
      - name: Custom Header Image
        pageRef: /features/default-header/
        parent: Features
        weight: 40
      - name: Responsive OpenStreetMap
        pageRef: /features/responsive-osm-map
        parent: Features
        weight: 45
      - name: Responsive Google Maps
        pageRef: /features/responsive-google-maps
        parent: Features
        weight: 50
      - name: Landing Page
        pageRef: /landing-page
        weight: 40
      footer:
      - name: Home 
        pageRef: /
        weight: 20
        params:
          target: 
      - name: Features 
        pageRef: /features
        weight: 30
        params:
          target: 
      - name: Landing Page
        pageRef: /landing-page
        weight: 40
        params:
          target: 
  fr:
    locale: fr-FR
    contentDir: content/fr
    label: Français
    weight: 2
    menu:
      main:
      - name: Accueil 
        pageRef: /
        weight: 20
      - name: Fonctionnalités
        pageRef: /features
        weight: 30
      - name: Gallerie avec Shortcode
        pageRef: /features/shortcode-gallery/
        parent: Fonctionnalités
        weight: 20
      - name: Type de page Gallerie
        pageRef: /features/gallery-page-type
        parent: Fonctionnalités
        weight: 30
      - name: Image personnalisée
        pageRef: /features/default-header/
        parent: Fonctionnalités
        weight: 40
      - name: Carte OpenStreetMap Responsive
        pageRef: /features/responsive-osm-map
        parent: Fonctionnalités
        weight: 45
      - name: Carte Google Maps Responsive
        pageRef: /features/responsive-google-maps
        parent: Fonctionnalités
        weight: 50
      - name: Page d'accueil multi-pages
        pageRef: /landing-page
        weight: 40
      footer:
      - name: Accueil 
        pageRef: /
        weight: 20
        params:
          target: 
      - name: Fonctionnalités 
        pageRef: /features
        weight: 30
        params:
          target: 
      - name: Page d'accueil multi-pages
        pageRef: /landing-page
        weight: 40
        params:
          target: 

# Google Analytics
services:
  googleAnalytics:
    id: G-MKFPZMY2YP

# Theme Configuration
markup:
  goldmark:
    parser:
      attribute:
        block: true
    renderer:
      unsafe: true

# Privacy Settings
privacy:
  googleAnalytics:
    disable: false
    respectDoNotTrack: false