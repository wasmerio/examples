baseURL = "/"
languageCode = 'zh-cn'
defaultContentLanguage = "zh"
title = "Almanac Demo"

enableRobotsTXT = true
enableEmoji = true
hasCJKLanguage = true
summaryLength = 60
pluralizeListTitles = false

[pagination]
  pagerSize = 10

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  # 基础信息
  author = "Your Name"
  description = "Your tagline here — describe what this site is about."
  avatar = "/apple-touch-icon.svg"       # 默认用主题自带的品牌 icon；放进 static/images/avatar.png 即可覆盖
  bannerImage = "/images/banner.webp"    # 顶部 banner（可选）
  position = "Job Title"
  location = "City"
  statusText = "Available"               # 头像上的小绿点状态
  email = "you@example.com"
  icp = ""                               # 大陆 ICP 备案号（可选）

  # Hero 文案
  heroTitle = "Hi, I'm Your Name"
  heroSubtitle = "A short paragraph introducing the site / yourself."
  tagline = "A short philosophy or motto."

  # 关于我（侧边栏简介，旧版本用，可留空）
  aboutShort = ""

  # 文章
  showReadingTime = true
  showWordCount = true

  # Waline 评论（部署后填写 serverURL 启用）
  [params.waline]
    serverURL = ""

  # 图标 / Favicon —— 默认值已经指向主题自带 static/ 下的资源，
  # 全部可选；若要替换，把同名文件放进自己 site 的 static/，或在这里改路径。
  # [params.icons]
  #   favicon        = "/favicon.svg"           # 主 favicon（SVG · currentColor 自适配深浅）
  #   faviconIco     = "/favicon.ico"           # 老浏览器 ICO 兜底
  #   appleTouchIcon = "/apple-touch-icon.svg"  # iOS 主屏（建议导出 PNG）
  #   maskIcon       = "/safari-pinned-tab.svg" # Safari 钉选标签（单色）
  #   maskIconColor  = "#c0764e"                # mask-icon 颜色

  # Social links, shown on the home masthead, the about page and the mobile
  # drawer in this order. Full reference: README, "Social links".
  #
  #   name    preset key (github, x, bilibili, xiaohongshu, wechat, zhihu,
  #           weibo, douyin, douban, juejin, gitee, csdn, youtube, tiktok,
  #           telegram, mastodon, bluesky, instagram, discord, threads,
  #           facebook, reddit, medium, stackoverflow, twitch, steam, mail,
  #           rss) or any name of your own
  #   url     profile link; an entry without url and without qr/id is skipped
  #   label   display name (presets have one built in)
  #   icon    override: a built-in icon name, or an SVG under assets/ or static/
  #   qr      image path -> the entry opens a card with the QR code
  #   id      account name shown in that card with a copy button
  #   hint    caption under the QR code
  #   hidden  true to keep the entry but not show it
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/yourname"

  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/yourname"

  [[params.socialIcons]]
    name = "bilibili"
    url = "https://space.bilibili.com/1"

  [[params.socialIcons]]
    name = "xiaohongshu"
    url = "https://www.xiaohongshu.com/user/profile/yourname"

  [[params.socialIcons]]
    name = "zhihu"
    url = "https://www.zhihu.com/people/yourname"

  # No profile URL: opens a card with the QR code and the account name.
  [[params.socialIcons]]
    name = "wechat"
    qr = "/images/wechat-qr.svg"
    id = "yourname"

  # A platform the theme does not know: give it a label and an icon. The icon
  # can be any built-in name or an SVG file that draws with currentColor.
  [[params.socialIcons]]
    name = "homepage"
    label = "Portfolio"
    icon = "icons/demo-brand.svg"
    url = "https://example.com"

  [[params.socialIcons]]
    name = "mail"
    url = "mailto:you@example.com"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

# 主导航
[menu]
  [[menu.main]]
    name = "首页"
    url = "/"
    weight = 10
  [[menu.main]]
    name = "项目"
    url = "/projects/"
    weight = 20
  [[menu.main]]
    name = "豆瓣"
    url = "/douban/"
    weight = 30
  [[menu.main]]
    name = "归档"
    url = "/archives/"
    weight = 40
  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 50
  [[menu.main]]
    name = "友链"
    url = "/links/"
    weight = 60

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false
  [markup.highlight]
    noClasses = false
    lineNos = false
    codeFences = true
    guessSyntax = true
    tabWidth = 2

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

# Required by the theme's Tailwind CSS build: Hugo records every class in the
# rendered HTML to hugo_stats.json, and the mount + cache buster rebuild the
# CSS when that file changes under `hugo server`.
[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'

[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'
canonifyURLs = false

[[module.imports]]
path = "github.com/amigoer/almanac"

[security]
  [security.exec]
    allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']
