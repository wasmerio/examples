baseURL = "/"
locale = 'en-US'
title = "Berg Docs"

defaultContentLanguage = 'en'

[params]
  logo = '/images/logo.svg'
  header = 'header1'
  favicon = '/images/logo.svg'
  description = 'A documentation for a simple, clean, and responsive Hugo theme.'
  date_format = 'January 2, 2006'
  breadcrumbs = false
  custom_js = ['js/_custom.js']
  custom_css = ['css/_custom.css']
  showDarkModeToggle = true

[markup]
  [markup.highlight]
    style = 'github-dark'
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
    ordered = false

[params.posts]
  showProfile = false
  showCategories = true

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1
[[menu.main]]
  name = "Docs"
  url = "/docs/"
  weight = 2
[[menu.main]]
  name = "Demo"
  url = "https://berg.stafura.dev/"
  weight = 4

[[menu.footer]]
  name = "Privacy Policy"
  url = "/privacy-policy/"
  weight = 1
canonifyURLs = false

[module]
[[module.imports]]
path = "github.com/matusstafura/berg-hugo-theme"

[minify]
disableJSON = true
