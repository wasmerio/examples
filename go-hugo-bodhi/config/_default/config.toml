baseURL = "/"
locale = "en-US"
title = "Bodhi Theme"


[params]
    subtitle = "simple and minimal."
    avatar = "/avatar.png"
    author = "Rohan Verma"
    footerMessage = "Keep it simple."
    disableSearch = false

[[menu.main]]
name = "home"
url = "/"
weight = 1

[[menu.main_right]]
name = "about"
url = "/about/"
weight = 1

[[menu.nav]]
name = "blogs"
url = "/blog"
weight = 1

[[menu.nav]]
parent = "blogs"
name = "tags"
url = "/tags"
weight = 2

[[menu.nav]]
parent = "blogs"
name = "categories"
url = "/categories"
weight = 3

[markup.goldmark.renderer]
unsafe= true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNoStart = 1
    noClasses = false
    tabWidth = 4

[[params.social]]
name = "Github"
icon = "github"
url = "https://github.com/rhnvrm/bodhi"
