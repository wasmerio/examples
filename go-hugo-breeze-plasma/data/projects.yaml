# Projects shown on the Projects page (params.view = "projects") and, for the featured one, on the home page.
# Fields: name, status (grouped in the order of params.projects.statuses), since, summary (one line),
# description (longer, projects page), pitch (short copy for the home card; falls back to description),
# stack (string or list), icon (any assets/breeze/icons/*.svg name), url, urllabel, writeup (page path),
# writeuplabel, links (extra [{text, url}]), featured.

- name: Commute Clock
  status: Live
  since: 2025
  featured: true
  icon: chart
  summary: Door-to-door commute times, charted.
  pitch: A tiny service that has logged my commute every 15 minutes for a year. Now it tells me when to leave.
  description: Polls a routing API every 15 minutes, stores the travel times in SQLite and draws a week-by-hour heat map, so the best departure window is obvious at a glance.
  stack: [Go, SQLite, Hugo]
  url: https://example.org/commute/
  writeup: /blog/commute-clock

- name: dotkit
  status: Live
  since: 2023
  icon: terminal
  summary: My dotfiles, packaged as a one-command setup.
  description: Shell, editor and Git configuration that installs on a fresh machine in under two minutes, with per-host overrides and no symlink farm.
  stack: Bash, chezmoi
  url: https://github.com/example/dotkit
  urllabel: Source

- name: Breeze Plasma for Hugo
  status: Beta
  since: 2026
  icon: apps
  summary: The theme this site uses.
  description: A calm, KDE Plasma/Breeze-inspired Hugo theme with a Dolphin-style archive, an "On this page" outline and a privacy-friendly video player.
  stack: [Hugo, CSS, vanilla JS]
  url: https://github.com/danielsada/hugo-breeze-plasma-inspired-theme
  urllabel: Source

- name: Pixel Garden
  status: Archived
  since: 2021
  icon: box
  summary: A generative pixel-art garden that grew one plant per commit.
  description: A weekend experiment that turned a repository's history into a slowly growing garden. Retired when the repository moved.
  stack: [TypeScript, Canvas]

