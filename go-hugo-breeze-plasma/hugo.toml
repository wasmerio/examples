# Example site for hugo-breeze-plasma-inspired-theme. Every theme option is shown here.
# Run from the repository root:  hugo server -s exampleSite
baseURL = "/"
title = "Alex Moreno"
locale = "en-US"
defaultContentLanguage = "en"
mainSections = ["blog", "notas"]
enableRobotsTXT = true
capitalizeListTitles = false   # keep tag/series names as written ("homelab", not "Homelab")

# The theme lives two folders up (the repository root). In your own site use
#   theme = "hugo-breeze-plasma-inspired-theme"   (vendored copy in themes/)
# or import it as a Hugo Module (path below, without the replacement).
[module]
  [[module.imports]]
    path = "github.com/danielsada/hugo-breeze-plasma-inspired-theme"

[taxonomies]
  tag = "tags"
  series = "series"

[pagination]
  pagerSize = 20

[services.rss]
  limit = 30

[markup]
  [markup.highlight]
    noClasses = false          # the theme ships the token colours
    guessSyntax = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false   # titled images become <figure>
    [markup.goldmark.parser.attribute]
      block = true

[params]
  description = "Alex Moreno writes about developer tools, calm software and the occasional home-lab adventure."
  tagline = "Developer tools & calm software"
  logo = "images/logo.svg"     # assets/images/logo.svg
  logowidth = 40
  logoplate = false            # the mark has its own background
  logoname = true
  colorscheme = "auto"         # auto | light | dark
  # titlesuffix = "Alex Moreno"
  # crumbroot = "example.org"

  wallpaper = "breeze/wallpaper.svg"
  [params.author]
    name = "Alex Moreno"
    email = "hello@example.org"
    emaillabel = "hello [at] example.org"   # shown instead of the address; links still use mailto:
    page = "/about"

  [params.colors]
    wall = "#3d6fd6"
    [params.colors.light]
      accent = "#8a5cd6"
      ink = "#5e2ca5"
    [params.colors.dark]
      accent = "#a77bff"
      ink = "#c6a8ff"

  [params.archive]
    path = "/posts"
    taxonomy = "tags"
    showtags = 8
    rowtags = 2
    search = true

  [params.series]
    taxonomy = "series"
    min = 2

  [params.dates]
    short = "2 Jan 2006"
    long = "2 January 2006"

  [params.post]
    toc = true
    progress = true
    readingtime = true
    anchors = true
    postnav = true
    byline = true
    shiftheadings = "auto"       # false | true | "auto": "# " headings in content render as <h2> (auto: only where used)
    toclevels = [2, 3]           # heading levels in "On this page" (after shifting)

  [params.images]
    maxwidth = 960
    quality = 75

  [params.rss]
    panel = true

  [params.projects]
    page = "/projects"
    statuses = ["Live", "Beta", "Paused", "Archived"]

  # Left panel width on desktop (default 15.5rem). Uncomment to fit longer project names.
  # [params.panel]
  #   width = "17rem"

  # "Projects" box in the left panel, on every page (collapsed under "On this page" on posts).
  [params.panel.projects]
    enable = true
    limit = 5
    pages = "all"                # all | nonpost
    collapse = true

  # Home: widgets in reading order. On wide screens "main" is the left column and "side" the right one;
  # on phones they stack (main first). Widgets: intro, latest, recent, series, project, talk, section, or your own.
  [params.home]
    [[params.home.main]]
      widget = "intro"
    [[params.home.main]]
      widget = "latest"
      count = 3
    [[params.home.main]]
      widget = "recent"
      offset = 3
      count = 5
      serieslinks = false        # the series widget below lists them
    [[params.home.main]]
      widget = "series"
      sort = "latest"            # latest | name
      # limit = 5
      counts = true
      date = "latest"            # latest | first | none
    [[params.home.side]]
      widget = "project"
    [[params.home.side]]
      widget = "talk"
    [[params.home.side]]
      widget = "section"
      section = "notas"
      count = 3

# Places (the panel's navigation). params: icon (any assets/breeze/icons/*.svg name), badge, count, lang.
[menus]
  [[menus.main]]
    name = "All posts"
    pageRef = "/posts"
    weight = 10
    [menus.main.params]
      icon = "blog"
      count = true                 # on the All-posts entry: every post
  [[menus.main]]
    name = "Notas"
    pageRef = "/notas"
    weight = 20
    [menus.main.params]
      icon = "notas"
      badge = "ES"
      count = true
  [[menus.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 30
    [menus.main.params]
      icon = "apps"
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 40
    [menus.main.params]
      icon = "user"
  [[menus.main]]
    name = "Contact"
    url = "mailto:hello@example.org"
    weight = 50
    [menus.main.params]
      icon = "mail"

  # Elsewhere (icon row at the bottom of the panel; RSS is added automatically).
  [[menus.social]]
    name = "GitHub"
    url = "https://github.com/example"
    weight = 10
    [menus.social.params]
      icon = "github"
  [[menus.social]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/example"
    weight = 20
    [menus.social.params]
      icon = "linkedin"
  [[menus.social]]
    name = "X (Twitter)"
    url = "https://x.com/example"
    weight = 30
    [menus.social.params]
      icon = "x"
canonifyURLs = false
