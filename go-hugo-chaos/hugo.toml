# Example site for the Chaos theme.
#
# Run it from the theme's root directory:
#
#   hugo server --source exampleSite
#
# `themesDir = '..'` with `theme = '.'` resolves to the theme's own root, so
# this works whatever the checkout directory is called. A real site would
# just set `theme = 'chaos'` instead of these two lines.

themesDir = '..'
baseURL = "/"
locale = 'zh-cn'
defaultContentLanguage = 'zh-cn'
title = '混沌札记'
hasCJKLanguage = true
enableGitInfo = false

# Hugo does not inherit [outputs] from a theme -- only output format and media
# type definitions merge -- so every site has to name the formats itself. These
# are the ones the theme provides templates for: the Atom feed, the two XSLT
# stylesheets that render the feeds and the sitemap as readable pages, and the
# redirect rules.
[outputs]
  home = ['HTML', 'ATOM', 'sitemapxsl', 'RSS', 'feedxsl', 'REDIR']
  section = ['HTML']
  taxonomy = ['HTML']
  term = ['HTML']

[pagination]
  pagerSize = 5

[taxonomies]
  tag = 'tags'
  category = 'categories'
  series = 'series'

[menus]
  [[menus.main]]
    identifier = 'home'
    pageRef = '/'
    weight = 10

  [[menus.main]]
    identifier = 'archives'
    pageRef = '/archives'
    weight = 20

  [[menus.main]]
    identifier = 'categories'
    pageRef = '/categories'
    weight = 30

  [[menus.main]]
    identifier = 'series'
    pageRef = '/series'
    weight = 35

  [[menus.main]]
    identifier = 'tags'
    pageRef = '/tags'
    weight = 40

  [[menus.main]]
    name = '关于'
    pageRef = '/pages/about'
    weight = 50

[markup.highlight]
  noClasses = false

# Collapse soft line breaks inside CJK paragraphs at parse time (including
# after full-width punctuation via 'css3draft'), so wrapped source lines do not
# turn into mid-sentence spaces in HTML or feeds.
[markup.goldmark.extensions.cjk]
  enable = true
  eastAsianLineBreaks = true
  eastAsianLineBreaksStyle = 'css3draft'
  escapedSpace = true

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['$$', '$$']]
    inline = [['\(', '\)']]

[markup.goldmark.parser.attribute]
  block = true

[params]
  subtitle = '一个*Chaos*主题的示例站点'
  description = 'Chaos主题的示例站点：中文排版、数学公式、提示框、代码高亮与深浅色模式。'
  mainSections = ['posts']

  [params.author]
    name = 'Chaos'

  [params.search]
    enable = true

canonifyURLs = false

[module]
[[module.imports]]
path = "github.com/delphij/chaos-theme"
