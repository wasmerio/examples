baseURL = "/"

defaultContentLanguage = 'en'
enableRobotsTXT = true
title = 'D-Science'
[pagination]
    pagerSize = 9

[params]
    favicon = "/images/favicon.ico"
    description = "A collection of notes, while I still have a mind to learn until God takes my breath away. In the era of AI, don't grow so lazy that your mind becomes dull—for tools only make things easier, they are no substitute for your own reason."
    author = "Teranix"
    
    [params.style]
        font_mono = "'IBM Plex Mono', 'Courier New', Courier, monospace"
        bg_primary = "#F5F0E8"
        text_primary = "#2C2C2C"
        border_dashed = "#B0A99F"

    [params.sidebar]
        enable_trending = true # Set to false to hide Kaggle/HuggingFace trending

    [params.ads]
        enable_sidebar = false
        sidebar_code = "<!-- Sidebar Ad Code -->"
        enable_in_article = false
        article_code = "<!-- In-Article Ad Code -->"

    [params.giscus]
        enable = false
        repo = "username/repository"
        repoId = "YOUR_REPO_ID"
        category = "General"
        categoryId = "YOUR_CATEGORY_ID"
        mapping = "url"
        strict = "0"
        reactionsEnabled = "1"
        emitMetadata = "0"
        inputPosition = "top"

        lang = "en"
        loading = "lazy"

    [params.google]
        # Google Search Console verification code
        # Get from: Search Console > Settings > Ownership verification > HTML tag
        # Example: search_console_verification = "abc123xyz"
        search_console_verification = ""

        # Google Analytics 4 Measurement ID
        # Get from: GA4 > Admin > Data Streams > Web > Measurement ID
        # Example: analytics_id = "G-XXXXXXXXXX"
        analytics_id = ""

[taxonomies]
    tag = "tags"
    category = "categories"

[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true # Allow HTML in Markdown if needed
    [markup.highlight]
        noClasses = false

[menu]
  [[menu.main]]
    identifier = "archive"
    name = "Archive"
    url = "/archive/"
    weight = 10
  [[menu.main]]
    identifier = "explore"
    name = "Explore"
    url = "/explore/"
    weight = 15
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 20
canonifyURLs = false

[module]
[[module.imports]]
path = "github.com/teranixbq/d-science"
