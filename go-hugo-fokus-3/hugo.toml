####################################
#! Put Hugo built-in config here  !#
####################################
baseURL = "/"
locale = "en-us"
title = "fokus theme"

pygmentsCodeFences = true
pygmentsUseClasses = false
pygmentsStyle = "dracula"
pygmentsCodefencesGuessSyntax = true
pygmentsUseClassic = false

copyright = "Copyright &copy; 2018 - 2024 Fokus Author"

enableRobotsTXT = true
canonifyURLs = false

paginate = 5

# disableKinds = []
enableGitInfo = false
enableEmoji = true

[taxonomies]
# category = "categories"
tag = "tags"
duration = "durations"

[pygmentsOptions]
noclasses = false

[permalinks]
posts = "/:contentbasename/"
pages = "/:contentbasename/"

[blackfriday]
hrefTargetBlank = true
plainIDAnchors = true
angledQuotes = false
latexDashes = true
nofollowLinks = true
noreferrerLinks = true

[social]
facebook_admin = ""
facebook_app_id = "12345"
facebook_pages = "12345"

[author]
name = "Fokus Author"
description = "I am <strong>not</strong> Groot."
email = "author@example.com"
url = "https://example.com"
city = "Surabaya"
country = "Indonesia"

[related]
threshold = 80
includeNewer = true
toLower = false

[[related.indices]]
name = "tags"
weight = 100

[[related.indices]]
name  = "date"
weight = 10
pattern = "2006"

[services]
[services.disqus]
shortname = "example"
[services.googleAnalytics]
id = "G-XXXXXXXXX"

[privacy]
[privacy.disqus]
disable = false
[privacy.googleAnalytics]
respectDoNotTrack = true
anonymizeIP = true
useSessionStorage = true
[privacy.instagram]
simple = true
[privacy.speakerDeck]
disable = true
[privacy.x]
enableDNT = true
simple = true
[privacy.vimeo]
simple = true
[privacy.youtube]
privacyEnhanced = true

####################################
#! Put theme-specific config here !#
####################################

[params]
useSassPipes = false    #set True for development
showHero = false
featuredTag = ""
showAttribution = true
useWebfont = true
brand = "<strong>fokus</strong> theme"
description = "Trial and Error"
relatedVisible = true
commentVisible = true
autoFigure = true
feedburner = ""
images = [
    "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEigeDK5NCfDCffwHjknWo0zztz911od3mT87ifPReZ7dWplBiRwhIys-6Y-F9JIdv9_VoqpmAup_w9_HjtXx8qAKF3s4Cdj-yWCcJUFehWZkfqmxPQ6lcvCpEnrpkEdm7SlGtzBp1VRhLYS1leNM-B9yvhrYJXWqhH2sroZY9cPxKdJ4A5L3NoG5Z2o6Bd-/s1280/junian-dev-banner.jpg"
]
customCSSAssets = []
customJSAssets = []

[params.postFooter]
title = "Like what you read?"
content = "Did you find this writing helpful, or save your valuable time? If so, you can support me by sending a cup of coffee with the button right here — you'll have my eternal gratitude!"

[params.verification]
google = ""
bing = ""
norton = ""

[params.license]
visible = true
content = "Creative Commons Attribution 4.0 International License"
contentUrl = "http://creativecommons.org/licenses/by/4.0/"
code = "MIT License"
codeUrl = "https://opensource.org/licenses/MIT"

[params.services.googleAdsense]
client = "ca-pub-12345"
slot = "12345"
inArticleSlot = "12345"
showTop = true
showMiddle = true
showBottom = true

[params.widget]
# addThis = "ra-12345"
buymeacoffee = ""
buymeacoffeeMessage = ""
blockAdBlock = "<strong>Using AdBlock?</strong> No worry, have a seat and read this message instead."

[params.widget.socialshare]
facebook = true
twitter = true
googleplus = true
linkedin = true
email = true
feed = true

# Menu for Top Left

[[params.menu.navleft]]
title = "go"
url = "/tags/go/"

[[params.menu.navleft]]
title = "development"
url = "/tags/development/"

# Menu for Top Right

[[params.menu.navright]]
title = "Archives"
url = "/archives/"

# Menu for footer

[params.menu.footer]
title1="Quick Links"
