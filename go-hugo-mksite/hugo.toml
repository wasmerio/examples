baseURL = "/"
locale = "en-GB"
title = "Mira Okafor"

enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

# The home page also writes /index.json, which the search reads.
[outputs]
  home = ["HTML", "JSON"]

[params]
  tagline = "sample portfolio built with mksite"
  description = "A made-up researcher's portfolio. It shows projects, research with a built-in PDF reader, and articles, all from Markdown."
  author = "Mira Okafor"
  owner = "Mira Okafor"
  licence = "A sample site. Every person, project and paper here is invented."
  themeColor = "#b03f1d"
  icon = "/icon.svg"
  logo = "/icon.svg"
  image = "/share.svg"
  palette = "clay"
  paletteSwitcher = true
  search = true

  [params.banner]
    text = "Mira Okafor is an invented character. Every project, paper and article on this site is made up to show the mksite theme."
    url = "https://mksite.czt.sh"
    linkLabel = "Get the theme"

  # Placeholders. Replace each url and handle with your own.
  [[params.social]]
    name = "GitHub"
    handle = "@yourname"
    url = "https://github.com/yourname"
    placeholder = true
  [[params.social]]
    name = "LinkedIn"
    handle = "in/yourname"
    url = "https://www.linkedin.com/in/yourname"
    placeholder = true
  [[params.social]]
    name = "Instagram"
    handle = "@yourname"
    url = "https://www.instagram.com/yourname"
    placeholder = true
  [[params.social]]
    name = "Mastodon"
    handle = "@yourname@example.social"
    url = "https://example.social/@yourname"
    placeholder = true
  [[params.social]]
    name = "Google Scholar"
    url = "https://scholar.google.com/"
    placeholder = true
  [[params.social]]
    name = "Email"
    url = "mailto:hello@example.org"

  [params.footer]
    headline = "Mira Okafor"
    text = "A sample portfolio. Projects, papers and notes on small systems that fail in ordinary ways."
    [params.footer.cta]
      label = "Say hello"
      url = "mailto:hello@example.org"
      icon = "mail"
    [[params.footer.columns]]
      title = "Explore"
      [[params.footer.columns.links]]
        label = "Portfolio"
        url = "/portfolio/"
      [[params.footer.columns.links]]
        label = "Projects"
        url = "/projects/"
      [[params.footer.columns.links]]
        label = "Research"
        url = "/research/"
      [[params.footer.columns.links]]
        label = "Articles"
        url = "/articles/"
      [[params.footer.columns.links]]
        label = "All work"
        url = "/work/"
      [[params.footer.columns.links]]
        label = "Résumé"
        url = "/resume/"
      [[params.footer.columns.links]]
        label = "About"
        url = "/about/"
    [[params.footer.columns]]
      title = "This site"
      [[params.footer.columns.links]]
        label = "Get the theme"
        url = "https://mksite.czt.sh"
      [[params.footer.columns.links]]
        label = "Theme docs"
        url = "https://docs.open.czt.sh/mksite/"
      [[params.footer.columns.links]]
        label = "Source on GitHub"
        url = "https://github.com/conanzhangtech/mksite"

  [params.initiative]
    name = "ProjectOpenCZTSH"
    url = "https://open.czt.sh"

[menus]
  [[menus.main]]
    name = "Portfolio"
    url = "/portfolio/"
    weight = 1
  [[menus.main]]
    name = "Projects"
    url = "/projects/"
    weight = 2
  [[menus.main]]
    name = "Research"
    url = "/research/"
    weight = 3
  [[menus.main]]
    name = "Articles"
    url = "/articles/"
    weight = 4
  [[menus.main]]
    name = "Résumé"
    url = "/resume/"
    weight = 5

[markup.goldmark.renderer]
  unsafe = true
[markup.highlight]
  noClasses = true
  style = "github"
[taxonomies]
canonifyURLs = false

[module]
[[module.imports]]
path = "github.com/conanzhangtech/mksite"
