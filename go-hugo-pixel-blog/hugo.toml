baseURL = "/"
title = "pixel-blog-hugo demo"

locale = "zh-cn"
defaultContentLanguage = "zh"
enableRobotsTXT = true
# 主内容区块：首页「最新文章」、归档、相关文章、搜索索引都基于它。
# 不写时 Hugo 会自动选页面最多的顶层区块；有 projects 等区块时建议显式指定。
mainSections = ["posts"]
hasCJKLanguage = true    # 中文按「字」统计：字数、阅读时长/摘要才准确
summaryLength = 80

[outputs]
  home = ["HTML", "RSS", "JSON"]

[pagination]
  pagerSize = 8

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false   # 图片渲染钩子输出 <figure>，避免被包进 <p>
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableofcontents]
    startLevel = 2
    endLevel = 4

# ── 示例站个性化（覆盖主题默认值；你重建自己的博客时写进自己的 hugo.toml）──
# 多语言：中文（根路径 /）+ 英文（/en/），页头地球图标可切换。
# 英文内容与中文同目录，用文件名后缀 .en.md 区分（Hugo 多语言标准做法）。
# 每个中文配置块下面紧跟对应的英文覆盖，便于对照检查是否漏翻。
[params]
  author = "小稳"
  description = "pixel-blog-hugo 主题 · 示例站点"
  # copyright = "© 2024-2026 小稳"   # 自定义页脚版权（不写则自动「© 年份 作者」）
  # icp = "京ICP备xxxxxxx号"                 # 页脚 ICP 备案号（国内站点；不写则不显示）
  # policeBeian = "京公网安备 11000002000001号"  # 页脚公安备案号（不写则不显示；自动链接到公安备案查询页）
  # policeBeianLink = "https://beian.mps.gov.cn/#/query/webSearch?code=11000002000001"  # 可选，公安备案查询链接（默认用备案号中的数字自动拼接）
  # policeBeianIcon = "/images/beian.png"   # 可选，公安备案徽章图标路径（放你站点的 static/ 或 assets/ 下）
  # keywords = ["Hugo", "博客"]      # <meta name="keywords">
  scanlines = true          # 示例站开启 CRT 扫描线

[languages.en.params]
  author = "Little Win"
  description = "pixel-blog-hugo theme · demo site"

# 品牌 / 顶部栏（logo/favicon 放你站点的 assets/ 下）
[params.identity]
  name = "小稳"
  logo = "images/logo.png"
  favicon = "images/logo.png"

[languages.en.params.identity]
  name = "Little Win"

# 首页主视觉文案（intro 支持 Markdown，可多段）
[params.hero]
  eyebrow = "示例站点 · 文案可随意修改"
  title = "小稳"
  tagline = "把折腾过的东西记录在这里。"
  intro = """
你好，这是 **pixel-blog-hugo** 主题的示例站点。

页面上的名字、标语、这段介绍，全都写在站点配置里，换成你自己的即可。

写文章、加项目，剩下的交给 Hugo。
"""

[languages.en.params.hero]
  eyebrow = "Demo site · edit these freely"
  title = "Little Win"
  tagline = "Notes on the things I've tinkered with."
  intro = """
Hi, this is the demo site for the **pixel-blog-hugo** theme.

The name, the tagline and this intro all live in the site config — swap in your own.

Write posts, add projects, and leave the rest to Hugo.
"""

# 首页「个人作品」入口：按 weight 取前 count 个项目
# （内容在 content/projects/ 下；所有项目都可点击进入详情，online: true 才显示绿点与「在线体验」）
[params.works]
  eyebrow = "FEATURED WORK"
  title = "个人作品"
  count = 3

[languages.en.params.works]
  title = "Selected Work"

# 首页「技术栈」：设 enable = false 或删除整块即隐藏。
# groups[].icon 内置图标名（未命中的值则原样显示为文字）：
#   frontend  backend  database  ai  devops  cloud  tools  mobile
#   design    language security  test  box（通用/默认）
[params.techstack]
  enable = true
  title = "技术栈"
  subtitle = "示例分组，按需改成你自己的"
  [[params.techstack.groups]]
    title = "编程语言"
    icon = "language"
    description = "平时主要使用的语言。"
    items = ["Java", "TypeScript", "Go"]
  [[params.techstack.groups]]
    title = "后端与数据库"
    icon = "backend"
    description = "服务端与数据存储。"
    items = ["Spring Boot", "MySQL", "Redis"]
  [[params.techstack.groups]]
    title = "前端与工具"
    icon = "frontend"
    description = "界面开发与构建工具。"
    items = ["Vue.js", "Vite", "Hugo"]
  [[params.techstack.groups]]
    title = "运维与效率"
    icon = "devops"
    description = "部署与日常提效。"
    items = ["Linux", "Nginx", "Docker"]

[languages.en.params.techstack]
  title = "Tech Stack"
  subtitle = "Sample groups — make them your own"
  [[languages.en.params.techstack.groups]]
    title = "Languages"
    icon = "language"
    description = "Languages I use day to day."
    items = ["Java", "TypeScript", "Go"]
  [[languages.en.params.techstack.groups]]
    title = "Backend & Databases"
    icon = "backend"
    description = "Server side and data storage."
    items = ["Spring Boot", "MySQL", "Redis"]
  [[languages.en.params.techstack.groups]]
    title = "Frontend & Tools"
    icon = "frontend"
    description = "UI development and build tooling."
    items = ["Vue.js", "Vite", "Hugo"]
  [[languages.en.params.techstack.groups]]
    title = "Ops & Productivity"
    icon = "devops"
    description = "Deployment and daily efficiency."
    items = ["Linux", "Nginx", "Docker"]

# 资源
# ogImage：站点默认分享图（1200×630，放站点 static/ 下，填 / 开头路径）
# pixelFont：像素字体 CSS（可换成自托管，见 README）
[params.assets]
  ogImage = "/images/og-default.png"

# 文章分享图：front matter 写 cover: "images/xxx.png"（放页面包或站点 assets/），
# 主题自动裁成 1200×630；页面 front matter 的 images（数组，取第一张）可作回退。

# 社交图标：填了值的项才显示（首页 Hero 与页脚各一行），全部留空则不显示。
# 内置图标（键名即下方字段名）：
#   github  email  x  telegram  wechat  weibo  bilibili  zhihu
#   juejin  youtube  linkedin  mastodon  discord  instagram  steam
[params.social]
  # 只填你想展示的，多余的删掉或注释掉即可
  github = "https://github.com/LittleWin8"        # GitHub
  email = "hello@example.com"                     # 邮箱（自动加 mailto:）
  x = "https://x.com/LittleWin8"                  # X
  bilibili = "https://space.bilibili.com/1000000" # 哔哩哔哩
  steam = "https://steamcommunity.com/id/LittleWin8"  # Steam
  # telegram = "https://t.me/你的用户名"            # Telegram
  # wechat = "https://你的微信二维码图链接"          # 微信（通常放二维码图片链接）
  # weibo = "https://weibo.com/你的用户名"          # 微博
  # zhihu = "https://www.zhihu.com/people/你的ID"   # 知乎
  # juejin = "https://juejin.cn/user/你的ID"        # 掘金
  # youtube = "https://youtube.com/@你的频道"       # YouTube
  # linkedin = "https://linkedin.com/in/你的ID"     # LinkedIn
  # mastodon = "https://你的实例/@你的用户名"        # Mastodon
  # discord = "https://discord.gg/你的邀请码"       # Discord
  # instagram = "https://instagram.com/你的用户名"  # Instagram

# 友链内容在 content/links.md 的 front matter 中维护（见该文件）。

# 示例站导航（覆盖主题默认，增补 项目 / 友链 / 关于）
# key 对应 i18n 键（navHome / navPosts / ...），未翻译时回退显示 name
[[params.nav]]
  key = "navHome"
  name = "首页"
  url = "/"
  icon = "home"
[[params.nav]]
  key = "navPosts"
  name = "博客"
  url = "/posts/"
  icon = "posts"
[[params.nav]]
  key = "navTags"
  name = "标签"
  url = "/tags/"
  icon = "tags"
[[params.nav]]
  key = "navArchives"
  name = "归档"
  url = "/archives/"
  icon = "archives"
[[params.nav]]
  key = "navProjects"
  name = "项目"
  url = "/projects/"
  icon = "projects"
[[params.nav]]
  key = "navLinks"
  name = "友链"
  url = "/links/"
  icon = "links"
[[params.nav]]
  key = "navAbout"
  name = "关于"
  url = "/about/"
  icon = "about"

# ── 多语言声明：菜单文案靠 i18n key 自动翻译，无需按语言复制 ──
# 根级 locale/title 等是默认语言的值；各语言块只写与根级不同的键。
[languages]
  [languages.zh]
    label = "简体中文"
    weight = 1
  [languages.en]
    locale = "en-us"
    label = "English"
    weight = 2
canonifyURLs = false

[module]
[[module.imports]]
path = "github.com/LittleWin8/pixel-blog-hugo"
