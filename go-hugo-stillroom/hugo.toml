baseURL = "/"
languageCode = "en-us"
title = "Stillroom Demo"

copyright = "© 2026 Stillroom Demo"

[pagination]
  pagerSize = 9

[taxonomies]
  tag = "tags"

[params]
  description = "Quiet design and clear focus for people who make thoughtful things."
  # Colour style: Stillroom, Stone, Ocean
  palette = "Stillroom"
  mainSections = ["posts"]
  dateFormat = "January 2, 2006"
  hideCredit = false

  [params.hero]
    eyebrow = "The essentials"
    heading = "Less, but better"
    text = "Quiet design and clear focus for people who make thoughtful things."
    image = "images/stillroom-art-1.jpg"
  [[params.hero.buttons]]
    text = "Explore the work"
    url = "#latest"
  [[params.hero.buttons]]
    text = "About"
    url = "/about/"
    outline = true

  [params.newsletter]
    enable = true
    title = "Join the list"
    text = "New posts, early news and the occasional treat. No spam, ever."
    action = "#"

  [[params.social]]
    name = "Instagram"
    url = "https://instagram.com/"

[menus]
  [[menus.main]]
    name = "Journal"
    url = "/posts/"
    weight = 1
  [[menus.main]]
    name = "Tags"
    url = "/tags/"
    weight = 2
  [[menus.main]]
    name = "About"
    url = "/about/"
    weight = 3
  [[menus.footer]]
    name = "About"
    url = "/about/"
    weight = 1
  [[menus.footer]]
    name = "Journal"
    url = "/posts/"
    weight = 2

[markup.goldmark.renderer]
  unsafe = false
canonifyURLs = false

[module]
[[module.imports]]
path = "github.com/jameseriksen74/hugo-theme-stillroom"
