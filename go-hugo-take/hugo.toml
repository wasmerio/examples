title = "Hugo blog theme"
baseURL = "/"

defaultContentLanguage = "ja-jp"

enableEmoji = true
hasCJKLanguage = true
ignoreErrors = ["additional-script-loading-error"]

[related]
includeNewer = true
threshold = 80
[[related.indices]]
name = "tags"
weight = 100
[[related.indices]]
name = "date"
weight = 10

[params]
DateForm = "2006.01.02"
brand = "{name}.blog"
mainSections = ["posts"]
featuredArticles = ["/posts/table-of-content", "/posts/markdown-syntax", "/posts/rich-content"]
popularPosts = []
editURL = "https://github.com/OWNER/REPO/edit/main/content"
selfHostFonts = false

[params.author]
name = "Author"
role = "Software engineer · Tokyo"
bio = "東京のソフトウェアエンジニア。毎日使う道具の設定、小さな発見、登壇の資料をまとめています。"
topics = ["Hugo", "Emacs", "Nix"]

[params.home]
greeting = ""

[params.social]
github = "https://github.com/..."
zenn = "https://zenn.dev/..."
twitter = "https://x.com/..."

[params.socialHandles]
github = "@..."

[params.tagColors]
Hugo = "pink"
Markdown = "cyan"
Math = "cyan"
Design = "purple"
Shortcode = "purple"
Emacs = "green"

Nix = "orange"
TOC = "yellow"

[[params.pdfLinks]]
title = "sample-slides"
url = "/pdf/sample-slides.pdf"
date = "2024-03-08"
event = "[イベント名] 2024"

[markup]
[markup.highlight]
noClasses = false

[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
startLevel = 2
endLevel = 4
ordered = false

[menus]
[[menus.main]]
name = "Posts"
url = "/posts/"
weight = 10
[[menus.main]]
name = "Tags"
url = "/tags/"
weight = 20
[[menus.main]]
name = "Graph"
url = "/graph/"
weight = 30
[[menus.main]]
name = "About"
url = "/pages/about/"
weight = 40

[Languages.ja-jp]
label = "Japanese"
locale = "ja-jp"
contentDir = "content/"

[Languages.ja-jp.params]
dateFormat = "2 May 2023"

[outputFormats]
[outputFormats.llms]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
rel = "alternate"
root = true

[outputFormats.llmsfull]
mediaType = "text/plain"
baseName = "llms-full"
isPlainText = true
rel = "alternate"
root = true

[sitemap]
changefreq = "weekly"
priority = 0.5
filename = "sitemap.xml"

[outputs]
home = ["HTML", "RSS", "llms", "llmsfull"]
section = ["HTML", "RSS"]
taxonomy = ["HTML"]
term = ["HTML", "RSS"]
page = ["HTML"]
canonifyURLs = false

[module]
[[module.imports]]
path = "github.com/takeokunn/hugo-take-theme"
