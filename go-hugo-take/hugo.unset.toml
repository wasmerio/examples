# Build check without theme params: hugo.toml minus [params], [menus], and
# [Languages.ja-jp.params]. Keep the two files' non-param settings in sync.
title = "Hugo blog theme"
baseURL = "/"

defaultContentLanguage = "ja-jp"

enableEmoji = true
hasCJKLanguage = true
ignoreErrors = ["additional-script-loading-error"]


[related]
includeNewer = true
threshold = 80
[[related.indices]]
name = "tags"
weight = 100
[[related.indices]]
name = "date"
weight = 10

[markup]
[markup.highlight]
noClasses = false

[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
startLevel = 2
endLevel = 4
ordered = false

[Languages.ja-jp]
label = "Japanese"
locale = "ja-jp"
contentDir = "content/"

[outputFormats]
[outputFormats.llms]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
rel = "alternate"
root = true

[outputFormats.llmsfull]
mediaType = "text/plain"
baseName = "llms-full"
isPlainText = true
rel = "alternate"
root = true

[sitemap]
changefreq = "weekly"
priority = 0.5
filename = "sitemap.xml"

[outputs]
home = ["HTML", "RSS", "llms", "llmsfull"]
section = ["HTML", "RSS"]
taxonomy = ["HTML"]
term = ["HTML", "RSS"]
page = ["HTML"]
