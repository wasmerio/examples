baseURL = "/"
title = "yugo"
locale = "en-us"

disableKinds = ["taxonomy", "term"]

[params]
  description = "an example site for yugo, a basic dark hugo theme"
  themeCredit = true

[menus]
  [[menus.main]]
    name = "posts"
    pageRef = "/posts"
    weight = 10
  [[menus.main]]
    name = "about"
    pageRef = "/about"
    weight = 20

[outputs]
  home = ["html", "rss"]

[markup.highlight]
  style = "github-dark"
  noClasses = true
canonifyURLs = false

[module]
[[module.imports]]
path = "github.com/byanthny/yugo"
