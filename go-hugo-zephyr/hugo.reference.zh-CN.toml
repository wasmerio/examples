# Zephyr 主题参考配置（中文注释版）
#
# 这是一份 **不生效** 的对照配置，为中文使用者提供逐键解释。
# 真正被 Hugo 加载的是同目录下的 `hugo.toml`；本文件名带 `.reference.` 前缀，
# Hugo 只会加载 `hugo.toml` 与 `hugo.<环境名>.toml`（如 `hugo.development.toml`），
# 因此本文件不会被误当作环境覆盖。
#
# 使用方式：把想要的键连同注释一起搬到你自己站点的 `hugo.toml`；
# 或者直接把本文件重命名为 `hugo.toml`（记得先备份原文件）。
#
# 结构原则（详见仓库根 CONVENTIONS.md §3）：
#   - Config 只放内容与行为参数：文案、开关、URL、图标名、排序权重、语言/主题默认值
#   - 任何视觉值（颜色、字号、圆角、间距、宽度、断点）都不进 config，视觉归 SCSS
#   - 视觉字符（如印章「笺」）不进 config，写死进模板
#   - TOML 里 scalar 键必须排在 array-of-tables 之前
#     （[[params.social]] 之后再写 [params.footer] 会崩）

# ─────────────────────────────────────────────────────────────
# 站点基础
# ─────────────────────────────────────────────────────────────
baseURL = "/"

defaultContentLanguage = "zh-cn"      # 默认落地语言；对应 [languages.<code>] 里的一个键
enableEmoji = true                     # 允许 :smile: 之类的短码转 emoji

# 为每种语言的首页额外生成 JSON 搜索索引（供 assets/js/search.js 读取）。
# 注意：显式列出 outputs 会「替换」而非「追加」Hugo 的首页默认输出，
# 所以必须保留 html 与 rss，再加上 json；对应模板是 layouts/index.json。
[outputs]
  home = ["html", "rss", "json"]

# ─────────────────────────────────────────────────────────────
# 全局 params（顶层）
# ─────────────────────────────────────────────────────────────
[params]
  # 首屏默认配色，"light" 或 "dark"。
  # 注意：这个 `theme` 是站点级"配色偏好"，与顶层 `theme = "hugo-theme-zephyr"`（主题目录名）同名不同物。
  # 用户浏览器切换后由 localStorage 覆盖，本键只决定首次访问的默认值。


  # 浏览器标签页图标。相对路径按 static/ 解析。
  favicon = "favicon.svg"

  # 首页全屏 hero 背景图。留空则整块不渲染（{{ with }} 门），不做裂图兜底。
  heroImage = "images/hero.svg"

  # 各段页（文章列表/随笔/关于/…）横幅背景图。整幅显示，不裁切。
  bannerImage = "images/banner.svg"

  # 作者头像。侧栏作者卡 / 文章页 mini-author / 关于页信笺 / 友链申请卡共四处使用。
  avatar = "images/avatar.svg"

  # OpenGraph / Twitter 卡片分享图的最后一级兜底。
  # 页面自身 cover → 页面 images 数组首图 → 站点 avatar → 站点 ogImage,四级依次回落。
  # 建议指向一张宽图(≥1200×630),社交平台裁切比例才好看;不设 avatar 时 term/taxonomy 这类
  # 无自身图的页面就会走到这条。
  ogImage = "images/banner.svg"

  # ── 首页各版块显示条数 ─────────────────────────────
  [params.home]
    latest = 5           # 最新文章卡片数
    collections = 8      # 合集书架格子数
    moments = 8          # 手记条数

  # ── 文章列表分页与预览 ─────────────────────────────
  # 卡片视图（宽卡+年分组时间轴）与列表视图（紧凑行式）密度不同，需各设每页数。
  # Hugo 原生 paginate 只有单一全局 pagerSize，无法区分两种视图，故这里自定义。
  [params.posts]
    cardPerPage = 10     # 卡片视图每页文章数
    listPerPage = 25     # 列表视图每页文章数
    categoryPreview = 6  # /categories/ 每个分类预览卡数（超过用「查看全部」跳转）

  # ── 手记分页 ─────────────────────────────────────
  [params.moments]
    perPage = 20         # /moments/ 每页手记条数

  # ── 单篇文章阅读页 ───────────────────────────────
  # 每个开关都可以在文章 front matter 里覆盖（如 toc = false 单篇关目录）。
  [params.reading]
    toc = true           # 左侧目录栏
    progress = true      # 顶部阅读进度条
    backToTop = true     # 右下浮动回顶按钮

  # ── 评论（opt-in，默认关闭，不注入任何第三方脚本）──
  # 只在单篇文章页启用。enable = false 整块消失；provider = "" 显示「配置我」占位。
  [params.comments]
    enable = true        # 评论总开关
    provider = ""        # "giscus" / "waline" / ""（占位）

    # giscus：需要 GitHub 仓库开启 Discussions，参数从 https://giscus.app 生成
    [params.comments.giscus]
      repo = ""                    # 如 "yourname/your-repo"
      repoId = ""
      category = "Announcements"
      categoryId = ""
      mapping = "pathname"


    # waline：需要自己部署服务端，见 https://waline.js.org
    [params.comments.waline]
      serverURL = ""

  # ── 首页 hero 副标题打字机 ──────────────────────────
  # 打字短语按语言分设，见 [languages.<code>.params].taglines
  [params.typewriter]
    enable = true
    speed = 90           # 每字符毫秒数
    pause = 1800         # 一整句打完后的停留毫秒数

  # ── 首页置顶轮播 ─────────────────────────────────
  [params.carousel]
    autoplay = 6000      # 自动播放间隔毫秒，0 关闭
    pinned = ["/posts/go-templates", "/posts/hugo-multilingual", "/posts/customize-zephyr"]
                         # 置顶文章 URL 列表（相对语言根）

  # ── 作者社交链接（有序数组表）──────────────────────
  # 每项是以下两种之一：
  #   跳转链接 { icon, label, url }：url 留空且 icon = "email" 自动加 mailto:；留空且 icon = "rss" 用站点 feed
  #   联络弹窗 { icon, label, value, qr? }：value 显示为「点击复制」按钮；可选 qr 填 static/ 下的二维码图片路径
  #   icon  → 对应 layouts/partials/icon.html 的内联 SVG 名字：
  #           github / email / wechat / qq / rss / x / telegram / linkedin / youtube / bilibili 等
  #   label → 读屏播报用
  # 注意：本 array-of-tables 之后不能再写 [params.xxx] scalar 键（TOML 语法要求）
  [[params.social]]
    icon = "github"
    label = "GitHub"
    url = "https://github.com/fengjot"
  [[params.social]]
    icon = "email"
    label = "Email"
    value = "sandubaikai@163.com"
  [[params.social]]
    icon = "wechat"
    label = "WeChat"
    value = "nimbusqzy"
    qr = "images/qr-wechat.png"   # 二维码图片放在 exampleSite/static/ 下，路径相对 static
  [[params.social]]
    icon = "qq"
    label = "QQ"
    value = "1603100157"
    qr = "images/qr-qq.png"

  # ── 页脚版权与备案 ───────────────────────────────
  # 版权年区间自动计算：since–当前年（相等则只显单年）。
  # 页脚标语与徽章按语言分设，见 [languages.<code>.params].footerTagline / footerBadges
  [params.footer]
    since = 2025         # 版权起始年
    icp = ""             # 中国 ICP 备案号（如 "京ICP备2025xxxxxx号-1"）；非空才显示，链接 beian.miit.gov.cn

  # ── 侧栏 widget 顺序（按上下文分设）─────────────────
  # 数组顺序 = 显示顺序。每个名字对应 layouts/partials/widgets/<name>.html。
  # 未列出的上下文（如某新 section）走默认列表。
  [params.sidebar]
    home       = ["author", "notice", "categories", "tags", "siteinfo"]
    posts      = ["author", "notice", "yearjump", "siteinfo"]
    categories = ["author", "notice", "yearjump", "siteinfo"]
    tags       = ["author", "notice", "yearjump", "siteinfo"]
    moments    = ["author", "notice", "heatmap"]
    friends    = ["author", "notice", "foverview", "criteria"]
    guestbook  = ["author", "notice", "categories", "tags", "siteinfo"]

# ─────────────────────────────────────────────────────────────
# 双语站点：中文默认 + 英文
# ─────────────────────────────────────────────────────────────
# 每语言显式声明 contentDir，内容分目录：content/zh-cn/… + content/en/…
# 同相对路径/slug 自动关联翻译；语言切换器优先 .Translations，找不到回退首页译文。
# 作者 ID 随语言切换：中文 = 风笺客，英文 = fengjot。

[languages]
  [languages.zh-cn]
    label = "中文"                 # 语言切换器可见文字
    locale = "zh-CN"                # 驱动日期/数字格式 + html lang + RSS 语言
    weight = 1                      # 排序权重，越小越靠前
    title = "风笺集"                # 品牌名 / 浏览器标签标题 / hero 主标题
    contentDir = "content/zh-cn"    # 该语言的内容目录

    [languages.zh-cn.params]
      author = "风笺客"                          # 页脚版权署名
      # 站点级 description 兜底。级联:页面 front matter 的 description → 页面 Summary
      # plainify 截 160 字 → 本键。首页与 term/taxonomy landing 这类无自身正文的页面命中本键。
      # 建议 30-160 字最贴近 Google 摘要长度;每语言各配一份,访问者看哪种语言就命中哪条。
      description = "风笺客的个人站 · 记录技术、生活与光影。风过留痕,字里相逢。"
      heroEyebrow = "风笺客 · FENGJOT"           # hero 主标题上方的小标签
      taglines = ["风过留痕  字里相逢", "风渡山海  笺载相逢"]
                                                 # hero 副标题打字机短语数组
      announcement = "新站初成，评论与友邻已开放——若你也在风里写字，欢迎留下一张笺。"
                                                 # 侧栏 notice widget 内容
      footerTagline = "来去皆是自由风，该相逢时自相逢"
                                                 # 页脚标语，独立于署名，可留空隐藏
      postEndNote = "文字写到此处，便是一程。若有同感，愿与你在别处再遇……"
                                                 # 文章末尾卡片收尾语
      # 页脚技术徽章；tone 映射到 SCSS 色板（brand=竹绿 / accent=朱红 / info=暖褐）
      # 不填 tone 走中性色。config 里不出现任何 hex，视觉值全归 SCSS。
      footerBadges = [
        { label = "框架", text = "Hugo", url = "https://gohugo.io/", tone = "accent" },
        { label = "主题", text = "Zephyr", url = "https://github.com/fengjot/hugo-theme-zephyr", tone = "brand" },
        { label = "CDN", text = "jsDelivr", url = "https://www.jsdelivr.com" },
      ]

  [languages.en]
    label = "English"
    locale = "en-US"
    weight = 2
    title = "Zephyr Letters"
    contentDir = "content/en"

    [languages.en.params]
      author = "fengjot"
      # 英文站点的 description 兜底,级联同中文段。
      description = "fengjot's personal site — notes on technology, life, and light. Where wind leaves traces, words bring us together."
      heroEyebrow = "FENGJOT"
      taglines = ["Where wind leaves traces, words bring us together", "Wind crosses mountains — letters carry our meetings"]
      announcement = "A new site begins. Comments and friend-links are open — leave a letter if you write in the wind too."
      footerTagline = "Come and go as a free wind; we meet when we are meant to"
      postEndNote = "Here the writing rests — if it spoke to you, may we meet again elsewhere…"
      footerBadges = [
        { label = "Frame", text = "Hugo", url = "https://gohugo.io/", tone = "accent" },
        { label = "Theme", text = "Zephyr", url = "https://github.com/fengjot/hugo-theme-zephyr", tone = "brand" },
        { label = "CDN", text = "jsDelivr", url = "https://www.jsdelivr.com" },
      ]

# ─────────────────────────────────────────────────────────────
# 主导航菜单
# ─────────────────────────────────────────────────────────────
# 标签文字由 i18n 提供，键 = 每项的 identifier（见 i18n/zh-cn.toml 与 i18n/en.toml）
# pageRef 指向内容页；weight 决定顺序

[menus]
  [[menus.main]]
    identifier = "home"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    identifier = "posts"
    pageRef = "/posts"
    weight = 20
  [[menus.main]]
    identifier = "moments"
    pageRef = "/moments"
    weight = 30
  [[menus.main]]
    identifier = "friends"
    pageRef = "/friends"
    weight = 40
  [[menus.main]]
    identifier = "about"
    pageRef = "/about"
    weight = 50
  [[menus.main]]
    identifier = "guestbook"
    pageRef = "/guestbook"
    weight = 60

# ─────────────────────────────────────────────────────────────
# Markdown 渲染
# ─────────────────────────────────────────────────────────────
[markup]
  # 原生目录（TOC）
  [markup.tableOfContents]
    startLevel = 2       # 从 h2 起收
    endLevel = 3         # 到 h3 止
    ordered = false      # 无序列表

  # Chroma 代码高亮
  [markup.highlight]
    noClasses = false    # 输出 class 让主题样式表控制配色（不内联 style）
    lineNos = false
    tabWidth = 4

  # Goldmark 渲染器
  [markup.goldmark.renderer]
    unsafe = false       # 转义内容里的原始 HTML，安全默认

  # 数学公式：保留 $$…$$ / \[…\] / \(…\) 原样，交给 passthrough render hook 转 MathML
  # 构建期完成，运行时不加载 KaTeX 或 MathJax
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block  = [['$$', '$$'], ['\[', '\]']]
      inline = [['\(', '\)']]
