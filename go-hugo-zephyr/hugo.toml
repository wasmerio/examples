# Example site config — runnable demo for the Zephyr theme
baseURL = "/"

defaultContentLanguage = "zh-cn"
enableEmoji = true

# Emit a JSON search index alongside each language's home page (consumed by assets/js/search.js).
# Keep "html" and "rss" — listing outputs replaces Hugo's defaults rather than adding to them.
[outputs]
  home = ["html", "rss", "json"]

# Site-wide params — point these at your own files in static/ to customize
[params]

  favicon = "favicon.svg"            # browser tab / site icon
  heroImage = "images/hero.svg"      # home full-screen hero background
  bannerImage = "images/banner.svg"  # section header banner across list pages; sized to 1600×480, other ratios center-cropped
  avatar = "images/avatar.svg"       # author avatar (sidebar author card, about page, post aside, friends apply-card)
  ogImage = "images/banner.svg"      # last-tier OpenGraph / Twitter share image; cascade is page.cover → page.images[0] → site.avatar → site.ogImage, so with `avatar` set above it wins for pages lacking their own cover/images. Use a wide image (≥1200×630) so social cards crop well.

  # How many cards each home section shows
  [params.home]
    latest = 5
    collections = 8
    moments = 8

  # Posts list views
  [params.posts]
    cardPerPage = 10     # timeline card view — wide cards, fewer per page
    listPerPage = 25     # list density view — compact rows, more per page
    categoryPreview = 6  # categories view — preview cards per category before "view all"

  # Moments feed — items per page
  [params.moments]
    perPage = 20

  # Single-post reading page — global toggles; only `toc` can be overridden per post (front matter `toc = false`)
  [params.reading]
    toc = true        # left table-of-contents column
    progress = true   # top reading-progress bar
    backToTop = true  # floating back-to-top button

  # Comments — opt-in; mounts wherever a template calls partial "comments.html" (posts, friends, guestbook). No external script loads unless enabled with a provider.
  [params.comments]
    enable = true     # master switch; false hides comments entirely
    provider = ""     # "giscus", "waline", or empty for a configure-me placeholder
    [params.comments.giscus]      # from https://giscus.app after enabling Discussions on your repo
      repo = ""                   # e.g. you/your-repo
      repoId = ""
      category = "Announcements"
      categoryId = ""
      mapping = "pathname"

    [params.comments.waline]      # https://waline.js.org — needs your own deployed server
      serverURL = ""

  # Home hero subtitle typewriter — phrases are per-language under [languages]
  [params.typewriter]
    enable = true
    speed = 90      # ms per character
    pause = 1800    # ms to hold each full phrase before switching

  # Home pinned carousel — autoplay interval in ms, 0 disables; plus the featured posts
  [params.carousel]
    autoplay = 6000
    pinned = ["/posts/go-templates", "/posts/hugo-multilingual", "/posts/customize-zephyr"]

  # Author social links — ordered list. Each entry is one of two shapes:
  #   link    { icon, label, url }        → a jump link (email auto-prefixes mailto:, rss with no url uses the site feed)
  #   contact { icon, label, value, qr? } → a popover card that shows `value` as a click-to-copy button;
  #                                         an optional `qr` image (path under static/) renders above it.
  # icon maps to a glyph in layouts/partials/icon.html: github, email, wechat, qq, rss, x, telegram, linkedin, youtube, bilibili …
  [[params.social]]
    icon = "github"
    label = "GitHub"
    url = "https://github.com/fengjot"
  [[params.social]]
    icon = "email"
    label = "Email"
    value = "sandubaikai@163.com"
  [[params.social]]
    icon = "wechat"
    label = "WeChat"
    value = "nimbusqzy"
    qr = "images/qr-wechat.png"   # 480×480 image under exampleSite/static/
  [[params.social]]
    icon = "qq"
    label = "QQ"
    value = "1603100157"
    qr = "images/qr-qq.png"

  # Footer — copyright span and tech badges. The year is global here; the tagline and
  # badge list live per-language under [languages.*.params] so their labels translate.
  [params.footer]
    since = 2025       # copyright start year; the end year is always the current year
    icp = ""           # China ICP filing number (e.g. "京ICP备2025xxxxxx号-1"); shown only when non-empty

  # Sidebar widgets per page context — list order = display order.
  # Each name maps to layouts/partials/widgets/<name>.html. Unlisted contexts fall back to a default.
  [params.sidebar]
    home       = ["author", "notice", "categories", "tags", "siteinfo"]
    posts      = ["author", "notice", "yearjump", "siteinfo"]
    categories = ["author", "notice", "yearjump", "siteinfo"]
    tags       = ["author", "notice", "yearjump", "siteinfo"]
    moments    = ["author", "notice", "heatmap"]
    friends    = ["author", "notice", "foverview", "criteria"]
    guestbook  = ["author", "notice", "categories", "tags", "siteinfo"]

# Bilingual site — Chinese as default plus English, via Hugo native multilingual.
# The author ID switches with language: 风笺客 for zh, fengjot for en.
[languages]
  [languages.zh-cn]
    label = "中文"
    locale = "zh-CN"   # drives date/number formatting and the html lang / RSS language
    weight = 1
    title = "风笺集"          # drives the brand name, browser tab title, and hero title
    contentDir = "content/zh-cn"   # this language's content tree; translations pair by matching relative path
    [languages.zh-cn.params]
      author = "风笺客"                    # footer copyright
      description = "风笺客的个人站 · 记录技术、生活与光影。风过留痕，字里相逢。"   # site-wide meta description fallback for pages without their own `description` or `Summary` (term/taxonomy landing, home); head.html cascade = page.Description → plainify(Summary,160) → this
      heroEyebrow = "风笺客 · FENGJOT"      # small label above the hero title
      taglines = ["风过留痕  字里相逢", "风渡山海  笺载相逢"]  # hero subtitle phrases
      announcement = "新站初成，评论与友邻已开放——若你也在风里写字，欢迎留下一张笺。"
      footerTagline = "来去皆是自由风，该相逢时自相逢"   # footer line; independent of the signature — set freely or leave empty to hide
      postEndNote = "文字写到此处，便是一程。若有同感，愿与你在别处再遇……"   # closing line on the end-of-article card
      footerBadges = [   # footer tech badges; optional tone maps the value chip to a palette color (brand / accent / info)
        { label = "框架", text = "Hugo", url = "https://gohugo.io/", tone = "accent" },
        { label = "主题", text = "Zephyr", url = "https://github.com/fengjot/hugo-theme-zephyr", tone = "brand" },
        { label = "CDN", text = "jsDelivr", url = "https://www.jsdelivr.com" },
      ]
  [languages.en]
    label = "English"
    locale = "en-US"
    weight = 2
    title = "Zephyr Letters"  # drives the brand name, browser tab title, and hero title
    contentDir = "content/en"   # this language's content tree; translations pair by matching relative path
    [languages.en.params]
      author = "fengjot"
      description = "fengjot's personal site — notes on technology, life, and light. Where wind leaves traces, words bring us together."   # site-wide meta description fallback for pages without their own `description` or `Summary` (term/taxonomy landing, home); head.html cascade = page.Description → plainify(Summary,160) → this
      heroEyebrow = "FENGJOT"
      taglines = ["Where wind leaves traces, words bring us together", "Wind crosses mountains — letters carry our meetings"]
      announcement = "A new site begins. Comments and friend-links are open — leave a letter if you write in the wind too."
      footerTagline = "Come and go as a free wind; we meet when we are meant to"   # footer line; independent of the signature — set freely or leave empty to hide
      postEndNote = "Here the writing rests — if it spoke to you, may we meet again elsewhere…"   # closing line on the end-of-article card
      footerBadges = [   # footer tech badges; optional tone maps the value chip to a palette color (brand / accent / info)
        { label = "Frame", text = "Hugo", url = "https://gohugo.io/", tone = "accent" },
        { label = "Theme", text = "Zephyr", url = "https://github.com/fengjot/hugo-theme-zephyr", tone = "brand" },
        { label = "CDN", text = "jsDelivr", url = "https://www.jsdelivr.com" },
      ]

# Main nav — labels come from i18n via each item's identifier
[menus]
  [[menus.main]]
    identifier = "home"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    identifier = "posts"
    pageRef = "/posts"
    weight = 20
  [[menus.main]]
    identifier = "moments"
    pageRef = "/moments"
    weight = 30
  [[menus.main]]
    identifier = "friends"
    pageRef = "/friends"
    weight = 40
  [[menus.main]]
    identifier = "about"
    pageRef = "/about"
    weight = 50
  [[menus.main]]
    identifier = "guestbook"
    pageRef = "/guestbook"
    weight = 60

# Markdown rendering — native table of contents and Chroma highlighting
[markup]
  [markup.tableOfContents]
    startLevel = 2   # build the TOC from h2 …
    endLevel = 3     # … down to h3
    ordered = false
  [markup.highlight]
    noClasses = false   # emit CSS classes so the theme stylesheet controls code colors
    lineNos = false
    tabWidth = 4
  [markup.goldmark.renderer]
    unsafe = false      # escape raw HTML in content for safety
  # Math — keep $$…$$ and \(…\) delimiters intact; passthrough render hooks turn them into MathML
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block  = [['$$', '$$'], ['\[', '\]']]
      inline = [['\(', '\)']]
canonifyURLs = false

[module]
[[module.imports]]
path = "github.com/fengjot/hugo-theme-zephyr"
