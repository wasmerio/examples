<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Zephyr wax seal">
  <!-- Pressed-wax seal: ring of lobes behind the disc, embossed inner ring, and the 笺
       glyph traced from KaiTi so it renders without any font. Geometry is shared with
       layouts/partials/seal.html (the header brand mark) — keep the two in sync.
       Light/dark variants mirror the --color-seal / --color-on-accent token flip. -->
  <style>
    .seal-bg { fill: #BC3B30; }
    .seal-fg { fill: #F6EFDD; }
    .seal-ring { stroke: #F6EFDD; }
    @media (prefers-color-scheme: dark) {
      .seal-bg { fill: #E98A6B; }
      .seal-fg { fill: #141C20; }
      .seal-ring { stroke: #141C20; }
    }
  </style>
  <!-- Pressed-wax edge: a ring of lobes behind the disc -->
  <g class="seal-bg">
    <circle cx="32" cy="3" r="2.6"/><circle cx="46.5" cy="7.5" r="2.6"/>
    <circle cx="56.5" cy="17.5" r="2.6"/><circle cx="61" cy="32" r="2.6"/>
    <circle cx="56.5" cy="46.5" r="2.6"/><circle cx="46.5" cy="56.5" r="2.6"/>
    <circle cx="32" cy="61" r="2.6"/><circle cx="17.5" cy="56.5" r="2.6"/>
    <circle cx="7.5" cy="46.5" r="2.6"/><circle cx="3" cy="32" r="2.6"/>
    <circle cx="7.5" cy="17.5" r="2.6"/><circle cx="17.5" cy="7.5" r="2.6"/>
  </g>
  <!-- Seal body -->
  <circle class="seal-bg" cx="32" cy="32" r="28"/>
  <!-- Embossed inner ring -->
  <circle class="seal-ring" cx="32" cy="32" r="22" fill="none" stroke-width="1.6" opacity="0.6"/>
