<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Zephyr demo avatar">
  <defs>
    <radialGradient id="paper" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#FBF6E9"/>
      <stop offset="100%" stop-color="#EDE3C9"/>
    </radialGradient>
    <linearGradient id="seal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C6483C"/>
      <stop offset="100%" stop-color="#A9332A"/>
    </linearGradient>
    <clipPath id="stamp">
      <rect x="116" y="116" width="280" height="280" rx="52"/>
    </clipPath>
  </defs>

  <!-- rice-paper field -->
  <rect width="512" height="512" fill="url(#paper)"/>

  <!-- cinnabar seal stamp -->
  <rect x="116" y="116" width="280" height="280" rx="52" fill="url(#seal)"/>

  <!-- wind ribbon carved through the seal -->
  <g clip-path="url(#stamp)" fill="none" stroke="#F6EFDD" stroke-width="17" stroke-linecap="round">
    <path d="M148 212 C 202 186, 244 238, 302 206 S 352 190, 372 208" opacity="0.95"/>
    <path d="M148 266 C 206 240, 246 292, 306 260 S 354 244, 372 260" opacity="0.8"/>
    <path d="M148 320 C 202 297, 246 344, 302 316 S 350 302, 372 314" opacity="0.62"/>
  </g>

  <!-- thin inner border for a carved-stamp edge -->
  <rect x="132" y="132" width="248" height="248" rx="40" fill="none" stroke="#F6EFDD" stroke-width="4" opacity="0.35"/>
</svg>
