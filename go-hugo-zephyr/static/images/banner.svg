<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <defs>
    <linearGradient id="bsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2EAD4"/>
      <stop offset="0.6" stop-color="#F7E3BE"/>
      <stop offset="1" stop-color="#F1CE9C"/>
    </linearGradient>
    <radialGradient id="bsun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FCEFC0" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#F8DD93" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#F8DD93" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bh1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE0C7"/><stop offset="1" stop-color="#B7D0BB"/></linearGradient>
    <linearGradient id="bh2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#88B59C"/><stop offset="1" stop-color="#6CA188"/></linearGradient>
    <linearGradient id="bh3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4E9079"/><stop offset="1" stop-color="#3A7B68"/></linearGradient>
    <linearGradient id="bwater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C6D6B9"/><stop offset="1" stop-color="#DCE5CB"/></linearGradient>
    <linearGradient id="breflect" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7DC92" stop-opacity="0.55"/><stop offset="1" stop-color="#F7DC92" stop-opacity="0"/></linearGradient>
    <filter id="bblurS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="bblurL" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <!-- sky + setting sun -->
  <rect width="1600" height="480" fill="url(#bsky)"/>
  <circle cx="1248" cy="196" r="300" fill="url(#bsun)"/>
  <circle cx="1248" cy="196" r="58" fill="#FBE7A2" filter="url(#bblurS)"/>

  <!-- soft drifting clouds -->
  <g fill="#FBF4E4" filter="url(#bblurL)">
    <ellipse cx="520" cy="150" rx="240" ry="34" opacity="0.5"/>
    <ellipse cx="940" cy="120" rx="180" ry="28" opacity="0.4"/>
    <ellipse cx="740" cy="232" rx="480" ry="56" opacity="0.5"/>
  </g>

  <!-- birds -->
  <g fill="none" stroke="#5B6B63" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <path d="M408 132 q13 -11 26 0 q13 -11 26 0"/>
    <path d="M492 166 q10 -8 20 0 q10 -8 20 0"/>
  </g>

  <!-- hills: distant (hazy) to near (deep) -->
  <path d="M0 262 C 320 240, 560 268, 840 256 C 1120 244, 1360 268, 1600 252 L1600 480 L0 480 Z" fill="url(#bh1)" filter="url(#bblurS)"/>
  <path d="M0 312 C 300 290, 580 320, 860 306 C 1140 292, 1380 316, 1600 302 L1600 480 L0 480 Z" fill="url(#bh2)"/>
  <path d="M0 364 C 360 344, 700 372, 1020 358 C 1300 346, 1440 370, 1600 360 L1600 480 L0 480 Z" fill="url(#bh3)"/>

  <!-- water + sun reflection -->
  <path d="M0 410 C 380 396, 780 420, 1140 408 C 1360 401, 1480 416, 1600 410 L1600 480 L0 480 Z" fill="url(#bwater)"/>
  <rect x="1210" y="412" width="68" height="68" fill="url(#breflect)" filter="url(#bblurS)"/>

  <!-- sailboat -->
  <g>
    <rect x="556" y="318" width="4" height="92" fill="#28323A"/>
    <path d="M558 326 L558 400 L524 400 Z" fill="#BC3B30"/>
    <path d="M558 326 L558 400 L598 400 Z" fill="#9A2E25"/>
    <path d="M520 406 Q558 424 598 406 L587 419 Q558 427 532 419 Z" fill="#28323A"/>
  </g>

  <!-- water ripples -->
  <g fill="none" stroke="#3F4F53" stroke-width="3" stroke-linecap="round" opacity="0.16">
    <path d="M330 438 q22 -8 44 0 q22 8 44 0"/>
    <path d="M820 452 q20 -7 40 0 q20 7 40 0"/>
    <path d="M1250 440 q18 -7 36 0 q18 7 36 0"/>
  </g>
</svg>
