<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2EAD4"/>
      <stop offset="0.55" stop-color="#F7E3BE"/>
      <stop offset="1" stop-color="#F1CE9C"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FCEFC0" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#F8DD93" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#F8DD93" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE0C7"/><stop offset="1" stop-color="#B7D0BB"/></linearGradient>
    <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#88B59C"/><stop offset="1" stop-color="#6CA188"/></linearGradient>
    <linearGradient id="h3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4E9079"/><stop offset="1" stop-color="#3A7B68"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C6D6B9"/><stop offset="1" stop-color="#DCE5CB"/></linearGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7DC92" stop-opacity="0.55"/><stop offset="1" stop-color="#F7DC92" stop-opacity="0"/></linearGradient>
    <filter id="blurS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="blurL" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>

  <!-- sky + setting sun -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1180" cy="408" r="360" fill="url(#sunGlow)"/>
  <circle cx="1180" cy="408" r="66" fill="#FBE7A2" filter="url(#blurS)"/>

  <!-- soft drifting clouds -->
  <g fill="#FBF4E4" filter="url(#blurL)">
    <ellipse cx="560" cy="300" rx="260" ry="42" opacity="0.5"/>
    <ellipse cx="980" cy="250" rx="200" ry="34" opacity="0.4"/>
    <ellipse cx="760" cy="470" rx="520" ry="70" opacity="0.55"/>
  </g>

  <!-- birds -->
  <g fill="none" stroke="#5B6B63" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <path d="M430 250 q14 -12 28 0 q14 -12 28 0"/>
    <path d="M520 290 q11 -9 22 0 q11 -9 22 0"/>
  </g>

  <!-- hills: distant (hazy) to near (deep) -->
  <path d="M0 520 C 320 472, 560 524, 840 502 C 1120 482, 1360 524, 1600 498 L1600 900 L0 900 Z" fill="url(#h1)" filter="url(#blurS)"/>
  <path d="M0 606 C 300 566, 580 616, 860 594 C 1140 574, 1380 610, 1600 590 L1600 900 L0 900 Z" fill="url(#h2)"/>
  <path d="M0 700 C 360 668, 700 708, 1020 692 C 1300 678, 1440 704, 1600 694 L1600 900 L0 900 Z" fill="url(#h3)"/>

  <!-- water + sun reflection -->
  <path d="M0 778 C 380 758, 780 790, 1140 776 C 1360 768, 1480 788, 1600 778 L1600 900 L0 900 Z" fill="url(#water)"/>
  <rect x="1142" y="780" width="76" height="120" fill="url(#reflect)" filter="url(#blurS)"/>

  <!-- sailboat -->
  <g>
    <rect x="585" y="636" width="5" height="150" fill="#28323A"/>
    <path d="M587 646 L587 772 L542 772 Z" fill="#BC3B30"/>
    <path d="M587 646 L587 772 L640 772 Z" fill="#9A2E25"/>
    <path d="M538 780 Q587 802 638 780 L624 796 Q587 808 552 796 Z" fill="#28323A"/>
  </g>

  <!-- water ripples -->
  <g fill="none" stroke="#3F4F53" stroke-width="3" stroke-linecap="round" opacity="0.16">
    <path d="M360 820 q26 -10 52 0 q26 10 52 0"/>
    <path d="M820 842 q24 -9 48 0 q24 9 48 0"/>
    <path d="M1238 824 q22 -8 44 0 q22 8 44 0"/>
  </g>
</svg>
