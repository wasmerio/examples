minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - astro@7.4.12
  - '@astrojs/markdown-satteri@0.4.10'
  - '@astrojs/vite-plugin-astro@0.1.3'
  - electron-to-chromium@1.5.472
  - knip@6.44.1
  - node-releases@2.0.63

trustPolicy: no-downgrade
shellEmulator: true

# These consumers use stable public APIs; the scoped replacements fix audit
# advisories while upstream ranges still request the affected release lines.
overrides:
  '@eslint/config-array>minimatch': ^11.0.3
  '@typescript-eslint/typescript-estree>minimatch': ^11.0.3
  eslint-plugin-sonarjs>minimatch: ^11.0.3

  eslint>minimatch: ^11.0.3
  micromark-extension-math>katex: ^0.19.1

packageExtensions:
  '@astrojs/astro2tsx@0.1.3':
    dependencies:
      '@emnapi/runtime': 1.11.3

allowBuilds:
  esbuild: true
  sharp: true
  simple-git-hooks: true
  workerd: true

catalogs:
  dev:
    '@antfu/eslint-config': ^10.0.0
    '@axe-core/playwright': ^4.14.0
    '@playwright/test': ^1.64.1
    eslint: ^10.14.0
    eslint-plugin-astro: ^3.2.1
    eslint-plugin-slop: ^0.1.3
    eslint-plugin-sonarjs: ^4.2.2
    knip: ^6.44.1
    nano-staged: ^1.0.2
    simple-git-hooks: ^2.14.0
    tsx: ^4.23.15
    vitest: ^5.0.5
    wrangler: ^4.156.0
  prod:
    '@astrojs/check': ^0.9.12
    '@astrojs/sitemap': ^3.7.4
    '@fontsource-variable/jetbrains-mono': ^5.3.0
    '@fontsource-variable/space-grotesk': ^5.3.0
    '@fontsource/anton': ^5.3.0
    '@fontsource/instrument-serif': ^5.3.0
    '@iconify-json/mdi': ^1.2.3
    '@iconify-json/ri': ^1.2.10
    '@iconify-json/simple-icons': ^1.2.101
    '@tailwindcss/vite': ^4.3.3
    astro: 7.4.12
    gsap: ^3.15.0
    lenis: ^1.3.27
    sharp: ^0.35.5
    tailwindcss: ^4.3.3
    typescript: ^6.0.3
    zod: ^4.6.7
