# =============================================================================
# Inkfolio — the only file you need to edit to make this site yours.
# Everything below is plain YAML: text after "#" is a comment, keep the quotes.
# =============================================================================

site:
  name: Inkfolio # shows in the nav and the browser tab
  nameZh: Inkfolio # Chinese name (used on /zh/ pages)
  tagline: Write it down, ship it, then write down what happened
  taglineZh: 写下来，做出来，再写下发生了什么
  description: The demo site for Inkfolio — an editorial Astro theme with posts, research, a weekly series, projects, an activity log and a tool shelf.
  descriptionZh: Inkfolio 的示例站——一个编辑风的 Astro 主题，带文章、研究、周更、项目、活跃度图和一个工具箱。
  url: https://example.com # your domain, no trailing slash (used for canonical + RSS)
  author: Inkfolio # shows on every article
  authorZh: Inkfolio
  greeting: Hey, I'm Inkfolio. # home hero headline
  greetingZh: 嗨，我是 Inkfolio。
  avatar: /avatar.png # shown on the home hero and About (friends list has its own avatar)
  email: hello@example.com # optional, only used in the footer if set
  telegram: '' # e.g. https://t.me/yourchannel — shown on the newsletter page
  contactEndpoint: '' # optional POST URL for the contact form (Formspree, Worker…). Empty = mailto:
  defaultLanguage: en # en → / is English, zh pages at /zh/
  showLanguageSwitcher: true # set to false for a single-language site

# -----------------------------------------------------------------------------
# Top navigation. A plain item has `href`; an item with `items` becomes a
# dropdown (same markup as the original site). labelZh is optional — omit it
# and the item stays out of the Chinese navigation instead of 404ing.
# -----------------------------------------------------------------------------
nav:
  # Each entry is a key plus a link: labels come from the UI dictionary in
  # every available language, so nothing needs translating by hand. To use your
  # own wording instead, write name: { en: ..., zh: ..., zh-hant: ... }.
  - key: weekly
    label: Weekly
    labelZh: 周更
    href: /weekly/
  - label: Research
    labelZh: 研究
    href: /research/
  - label: Docs
    labelZh: 文档
    href: /docs/
  - label: Posts
    labelZh: 文章
    href: /posts/
  - label: Categories
    labelZh: 分类
    href: /categories/
  - label: Projects
    labelZh: 项目
    href: /projects/
  - label: About
    labelZh: 关于
    href: /about/
  - label: More
    labelZh: 更多
    items:
      - label: Activity
        labelZh: 活跃度
        href: /log/
        sub: One square per day
        subZh: 一格一天
      - label: Nav
        labelZh: 导航
        href: /nav/
        sub: Bookmarks I reopen
        subZh: 会反复打开的书签
      - label: Friends
        labelZh: 友链
        href: /friends/
        sub: Sites worth reading
        subZh: 值得读的站
      - label: MCP
        labelZh: MCP
        href: /mcp/
        sub: Connect your agent
        subZh: 让 agent 直连本站

# The button on the right of the navigation.
navCta:
  label: Say hi
  labelZh: 打个招呼
  href: /contact/

# -----------------------------------------------------------------------------
# Social links in the footer.
# -----------------------------------------------------------------------------
social:
  - label: GitHub
    href: https://github.com/respectevery01/inkfolio
    icon: github
  - label: Email
    href: mailto:hello@example.com
    icon: email

# Footer columns. Three columns, same layout as the original site.
footerColumns:
  - title: Writing
    titleZh: 写作
    links:
      - { label: Weekly, labelZh: 周更, href: /weekly/ }
      - { label: Posts, labelZh: 文章, href: /posts/ }
      - { label: Docs, labelZh: 文档, href: /docs/ }
      - { label: Research, labelZh: 研究, href: /research/ }
      - { label: RSS, labelZh: RSS, href: /rss.xml }
  - title: Build
    titleZh: 构建
    links:
      - { label: Projects, labelZh: 项目, href: /projects/ }
      - { label: Activity, labelZh: 活跃度, href: /log/ }
      - { label: Nav, labelZh: 导航, href: /nav/ }
      - { label: MCP, labelZh: MCP, href: /mcp/ }
  - title: Me
    titleZh: 我
    links:
      - { label: About, labelZh: 关于, href: /about/ }
      - { label: Contact, labelZh: 联系, href: /contact/ }
      - { label: Newsletter, labelZh: 订阅, href: /newsletter/ }
      - { label: Friends, labelZh: 友链, href: /friends/ }
      - { label: Privacy, labelZh: 隐私, href: /privacy/ }

# -----------------------------------------------------------------------------
# The banner at the very top of the page.
#   enabled: false   → the banner disappears from the whole site (one line)
#   dismissible      → true lets visitors close it; their choice is remembered
#   text / textZh    → the sentence we show
#   link / linkText  → the one link we show next to it
# -----------------------------------------------------------------------------
promoBanner:
  enabled: true
  dismissible: true
  text: This site's SEO runs on ZensInk
  textZh: 本站的 SEO 用 ZensInk 跑
  link: https://zens.ink
  linkText: Take a look
  linkTextZh: 去看看

# -----------------------------------------------------------------------------
# Look and feel. Accent colour is the only colour you normally need to change.
# -----------------------------------------------------------------------------
theme:
  accent: '#ff6b01' # links, underlines, highlights
  defaultMode: auto # auto | light | dark
  radius: 12px

# -----------------------------------------------------------------------------
# Analytics — all three are off by default. Flip `enabled` to true and fill in
# your own id. Nothing loads on the page until you do; there is no tracking
# script in the theme otherwise.
#
#   umami   — self-hosted or cloud. Needs the script URL and the website id.
#   google  — GA4 measurement id (starts with G-)
#   clarity — Microsoft Clarity project id
# -----------------------------------------------------------------------------
analytics:
  umami:
    enabled: false
    scriptUrl: https://analytics.example.com/script.js
    websiteId: ''
  googleAnalytics:
    enabled: false
    measurementId: ''
  clarity:
    enabled: false
    projectId: ''

# -----------------------------------------------------------------------------
# Cookie consent. Only needed when a provider sets cookies (GA4, Clarity).
# Umami is cookieless, so a site running only Umami can set `enabled: false`.
# Analytics that need consent are not loaded until the visitor accepts.
# -----------------------------------------------------------------------------
consent:
  enabled: true
  storageKey: inkfolio-consent
  text: This site uses cookies for anonymous analytics.
  textZh: 本站使用 cookie 做匿名访问统计。
  link: /privacy/
  linkLabel: What is collected
  linkLabelZh: 具体收集什么
  accept: Accept
  acceptZh: 接受
  reject: Decline
  rejectZh: 拒绝

# -----------------------------------------------------------------------------
# SEO defaults. Per-page titles and descriptions come from the Markdown files;
# these are the fallbacks and the shared metadata.
# -----------------------------------------------------------------------------
seo:
  titleTemplate: '{title} — Inkfolio' # set to "{title}" to drop the suffix
  defaultDescription: The demo site for Inkfolio — an editorial Astro theme with posts, research, a weekly series, projects and an activity log.
  ogImage: /og-default.png # 1200×630 image used by social cards
  twitterHandle: '' # without the @, e.g. "yourname"
  locale: en_US
  localeZh: zh_CN
  keywords: [astro, blog, theme, editorial, bilingual]
  # structured data (WebSite + Person + BlogPosting). Turn off if you already
  # inject your own JSON-LD elsewhere.
  structuredData: true
  robots: index,follow

# -----------------------------------------------------------------------------
# MCP page — on in this demo. Set `enabled: false` to hide it: the page becomes
# noindex and the nav entry disappears. Everything here is plain YAML, so
# sources and tools are edited without touching code.
# -----------------------------------------------------------------------------
mcp:
  enabled: true
  endpoint: '' # empty = https://<your domain>/mcp
  name: Inkfolio MCP
  sources:
    - host: your-site.com
      items: 42
      desc:
        en: Articles and notes, English and Chinese
        zh: 文章与笔记，中英双语
    - host: second-site.com
      items: 18
      desc:
        en: Docs and release notes
        zh: 文档与更新日志
  tools:
    - name: list_sources
      args: ''
      desc:
        en: Every connected source with its item count.
        zh: 列出所有接入的内容源及条目数。
    - name: search
      args: query, source?
      desc:
        en: Keyword search across all sources. Start here.
        zh: 跨源关键词搜索，从这里开始。
    - name: read
      args: source, id
      desc:
        en: Full text of one item as markdown, with metadata.
        zh: 读取单条全文（markdown，带元数据）。

# -----------------------------------------------------------------------------
# Footer. Copyright line, the author, and a link back to your site.
# -----------------------------------------------------------------------------
footer:
  # {year} and {name} are replaced. Leave empty for "© {year} {copyrightName}".
  copyright: '© {year} {name}'
  copyrightZh: '© {year} {name}'
  copyrightName: Inkfolio # fills {name} and the default line
  text: '' # free text after the copyright, e.g. a license note
  textZh: ''
  authorUrl: https://jask.dev # the author line links back here
  authorLabel: jask.dev
  # Kept, but deliberately quiet: 11px, muted, under everything else.
  credit:
    show: true
    label: Powered by Inkfolio
    labelZh: 由 Inkfolio 驱动
    href: https://github.com/respectevery01/inkfolio
  # Wide illustration above the footer columns. 1600×529 WebP, two files so the
  # drawing can differ per theme. Replace the files in public/footer/ — same
  # names, same size — and nothing else needs to change. Set art to "" to drop it.
  artLight: /footer/footer-light.webp
  artDark: /footer/footer-dark.webp

# -----------------------------------------------------------------------------
# Local time and weather in the footer. Disabled by default; give it a latitude,
# longitude and timezone to turn it on. `endpoint` is optional: point it at your
# own proxy if you would rather keep a private provider behind a server. With no
# endpoint the widget calls Open-Meteo, which needs no API key.
# -----------------------------------------------------------------------------
weather:
  enabled: true # the on/off switch for the whole widget
  mode: visitor   # visitor = the reader's own location · fixed = the address below
  units: celsius # celsius | fahrenheit
  geoEndpoint: '' # only used in visitor mode; '' uses ipwho.is
  fallbackLatitude: 31.2304 # visitor mode only, when the lookup fails
  fallbackLongitude: 121.4737
  # fixed mode only — flip mode to `fixed` and edit these
  label: Shanghai
  labelZh: 上海
  latitude: 31.2304
  longitude: 121.4737
  timezone: Asia/Shanghai

# -----------------------------------------------------------------------------
# Languages. Turn the whole thing off for a single-language site: routes for the
# other languages are not built, the switcher disappears and hreflang is left
# out entirely. `languages` decides what is published; `defaultLanguage` is what
# a reader with no preference (and every crawler) lands on.
# -----------------------------------------------------------------------------
i18n:
  enabled: true
  defaultLanguage: en # en | zh | zh-hant
  languages: [en, zh, zh-hant]
  detectBrowserLanguage: false # true = first visit follows Accept-Language

# -----------------------------------------------------------------------------
# Cover images on posts. `list` shows them on the archive, `article` shows them
# at the top of the post. Turn one off without touching any template.
# -----------------------------------------------------------------------------
covers:
  list: true
  article: true

# -----------------------------------------------------------------------------
# Icons. Default is the bundled Font Awesome. To use an Alibaba Iconfont project
# instead, set mode: iconfont and paste the symbol JS from your project page
# (at.alicdn.com/t/c/font_xxx.js). The script is loaded in the head, so icons
# marked up as <svg class="icon"><use href="#icon-name"/></svg> resolve.
# -----------------------------------------------------------------------------
icons:
  mode: fontawesome # fontawesome | iconfont
  iconfont:
    jsUrl: '' # e.g. //at.alicdn.com/t/c/font_1234567_abcdef.js
    prefix: icon # symbol prefix in that project

# -----------------------------------------------------------------------------
# About page. Every string may be plain or keyed by language; values marked
# "markdown" accept **bold**, *italic*, `code`, [links](url), - lists and blank-
# line paragraphs. Rendered without a Markdown dependency, no raw HTML.
# -----------------------------------------------------------------------------
about:
  intro:
    en: |
      **Jask** is the demo site for an open-source theme: editorial layout, warm paper, one accent colour, system fonts, no front-end framework.

      The whole site is driven by one YAML file — name, navigation, colours, banner, analytics, SEO. Writing happens in Markdown.

      This page is the same: everything below comes from `about:` in `site.config.yaml`. Nothing here is hardcoded in a template.

    zh: |
      **Jask** 是一个开源主题的示例站：编辑风排版、暖纸白、一个强调色、系统字体，没有前端框架。

      整站由一份 YAML 配置驱动——站名、导航、配色、横幅、统计、SEO 全在里面。写作只用 Markdown。

      这一页也一样：下面所有内容都来自 `site.config.yaml` 的 `about:`，模板里没有写死的文案。

  expertise:
    - icon: search
      title: { en: SEO engineering, zh: SEO 工程 }
      text:
        en: Search pipelines built on free data only — GSC, Bing, SERP structure scoring. Technical audits and GEO.
        zh: 只用免费数据源的搜索管线：GSC、Bing、SERP 结构评分。技术审计和 GEO。
    - icon: bot
      title: { en: AI agents, zh: AI agent }
      text:
        en: Several product lines, one person. Agents draft, audit and deploy; I set direction and verify.
        zh: 几条产品线，一个人。agent 负责写、审、部署，我定方向和验收。
    - icon: box
      title: { en: Static sites, zh: 静态站 }
      text:
        en: Astro on Cloudflare. No server, no database, no web fonts.
        zh: Astro 加 Cloudflare，零服务器、零数据库、零 webfont。

  stack:
    - { icon: globe, label: Astro, note: { en: site framework, zh: 站点框架 } }
    - { icon: box, label: Cloudflare, note: { en: Pages + Workers, zh: Pages + Workers } }
    - { icon: search, label: Python, note: { en: tooling, zh: 工具链 } }
    - { icon: bot, label: TypeScript, note: { en: UI, zh: 界面 } }

  journey:
    - icon: tag
      version: v1.0.0
      when: 2026-11
      what:
        en: 'First public release: trilingual pages, config-driven everything, activity log, MCP page, not one front-end framework.'
        zh: '首个公开版本：三语页面、全部配置化、活跃度页、MCP 页，前端框架一个都没有。'
    - icon: code
      version: v0.3.0
      when: 2026-11
      what:
        en: Nav, friends and the About page moved into YAML; icons by filename, no Astro edits.
        zh: 导航、友链和 About 页搬进 YAML；图标按文件名引用，不用改 Astro。
    - icon: flask
      version: v0.2.0
      when: 2026-11
      what:
        en: Analytics (Umami / GA4 / Clarity) and SEO defaults moved into one config block.
        zh: 统计（Umami / GA4 / Clarity）和 SEO 默认值收进同一个配置块。
    - icon: box
      version: v0.1.0
      when: 2026-10
      what:
        en: Editorial base — warm paper, one accent, system fonts, light and dark.
        zh: 编辑风底座：暖纸白、一个强调色、系统字体、亮暗双主题。
