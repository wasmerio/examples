# The /nav directory — tools grouped by what they are for.
#
# Icons: put an SVG in public/icons/ and write its filename (without .svg) in
# the `icon` field. No Astro changes needed — add a row, pick a name that
# exists in public/icons/, done. Leave `icon` out and the first letter is used.
#
# Shipped icons: jask, astro, fontawesome, github.

- id: sites
  en: Sites
  zh: 站点
  note:
    en: Places worth opening first.
    zh: 打开浏览器先去的几个地方。
  links:
    - name: jask.dev
      url: https://jask.dev
      icon: jask
      note: { en: Weekly dispatches, notes and build logs, zh: 周更、随手记和构建日志 }
    - name: Astro
      url: https://astro.build
      icon: astro
      note: { en: The framework this theme is built on, zh: 这个主题用的框架 }

- id: tooling
  en: Tooling
  zh: 工具
  note:
    en: Two things that make the rest of this possible.
    zh: 让上面这些成立的两样东西。
  links:
    - name: Font Awesome
      url: https://fontawesome.com
      icon: fontawesome
      note: { en: Every icon on this site comes from here, zh: 这个站的图标全部来自这里 }
    - name: GitHub
      url: https://github.com/respectevery01/inkfolio
      icon: github
      note: { en: Source for this theme, zh: 这个主题的源码 }
