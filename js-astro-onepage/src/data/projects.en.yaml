头衔: Independent developer · Founder of "365 Open Source"
介绍: When a problem comes up, build a tool to solve it now and avoid the same pitfalls next time. Open-source projects span workflow automation, AI and multilingual tools, document and knowledge management, everyday utilities like phone screen mirroring, browser games, and interactive picture books.
页脚: 'Project #022 of <a href="https://github.com/rockbenben/365opensource" target="_blank" rel="noopener noreferrer" class="hover:underline">365 Open Source</a>'

作品:
  AiShort:
    介绍: Find, save, and share AI prompts, then copy any prompt in one click. AiShort has 100,000+ registered users, an interface in 18 languages, and options for offline use and intranet deployment.
  Subtitle Translator:
    介绍: Batch-translate subtitles in your browser without changing the timing. Supports SRT, ASS, VTT, LRC, 120+ languages, and bilingual exports. Listed in DeepSeek's official integration directory.
  千世书 Thousand Lives:
    名字: Thousand Lives
    介绍: A Chinese-language browser game with 10 scenarios, from fantasy to espionage and post-apocalyptic survival. Your choices shape the ending. Play locally without an API key, or connect your own model provider for AI mode.

文字:
  联系我: Contact
