name: starglow

services:
  dev:
    build: .
    image: starglow-dev:local
    init: true
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: ${PROJECT_DIR:?run via ./dev.sh}
    volumes:
      # Same absolute path as on the host, so node_modules metadata and error paths match.
      - ./:${PROJECT_DIR}
    environment:
      # Arbitrary host UIDs have no passwd entry and no writable home.
      HOME: /tmp/home
      # Empty falls back to the default in astro.config.
      SITE_URL: ${SITE_URL:-}
      BASE_PATH: ${BASE_PATH:-}
      # Optional Search Console token. Key-only: compose takes the value from the
      # host shell when it is set and leaves the variable out otherwise, so an
      # empty value never shadows a `.env` entry.
      PUBLIC_GOOGLE_SITE_VERIFICATION:
    ports:
      - "4321:4321"
