label:
  comment: Optional label for the grid to help identify it in the editor.
  type: text
columns:
  comment: Number of columns from 640px up (small screens always show one). Auto fits as many min-width items as the space allows.
  type: select
  options:
    values:
      - id: auto
        name: Auto
      - id: "2"
        name: "2"
      - id: "3"
        name: "3"
      - id: "4"
        name: "4"
      - id: "5"
        name: "5"
      - id: "6"
        name: "6"
minItemWidth:
  comment: Auto columns only — the minimum width for each item in pixels.
  type: number
maxItemWidth:
  comment: Auto columns only — optional cap on item width in pixels (leave empty to let items stretch).
  type: number
items:
  label: Grid Items
  comment: The cells of the grid, each holding its own blocks.
  type: array
  options:
    structures: _structures.gridItems
gap:
  comment: The gap between grid items.
  type: select
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl

# Inlined rather than shared: a second `_inputs_from_glob` entry on a structure
# value never reached the editor, leaving this field as free text.
spaceBefore:
  comment: Space above this block. Default follows the block's type; a Spacer replaces the gap entirely. Has no effect on the first block in a container.
  type: select
  options:
    values:
      - id: default
        name: Default
      - id: none
        name: None
      - id: tight
        name: Tight
      - id: loose
        name: Loose
