label:
  type: text
  comment: Optional label to identify the wrapper in the editor. When set and no HTML id is provided, an id is derived from this value.
columns:
  type: range
  comment: Number of columns on screens 640px and up (small screens always show two).
  options:
    min: 2
    max: 5
    step: 1
gap:
  comment: The gap between masonry items.
  type: select
  options:
    values:
      - id: none
        name: None
      - id: xs
        name: Extra Small
      - id: sm
        name: Small
      - id: md
        name: Medium
      - id: lg
        name: Large
      - id: xl
        name: Extra Large
      - id: 2xl
        name: 2xl
      - id: 3xl
        name: 3xl
items:
  label: Masonry Items
  comment: The tiles in the wall, each holding its own blocks. They stay in the order you list them, reading left to right.
  type: array
  options:
    structures: _structures.masonryItems

# Inlined rather than shared: a second `_inputs_from_glob` entry on a structure
# value never reached the editor, leaving this field as free text.
spaceBefore:
  comment: Space above this block. Default follows the block's type; a Spacer replaces the gap entirely. Has no effect on the first block in a container.
  type: select
  options:
    values:
      - id: default
        name: Default
      - id: none
        name: None
      - id: tight
        name: Tight
      - id: loose
        name: Loose
