packages:
  - packages/*

# Packages allowed to run install scripts (pnpm blocks them by default).
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  workerd: false

minimumReleaseAgeExclude:
  - '@emdash-cms/admin@1.4.0'
  - '@emdash-cms/auth@1.4.0'
  - '@emdash-cms/blocks@1.4.0'
  - '@emdash-cms/gutenberg-to-portable-text@1.4.0'
  - emdash@1.4.0
