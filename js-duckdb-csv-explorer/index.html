<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DuckDB CSV Explorer</title>
    <style>
      body { display: flex; flex-direction: column; margin: 0; height: 100dvh; font: 1rem system-ui, sans-serif; }
      header { padding: 1rem; }
      h1, p { margin: 0 0 .5rem; }
      code { overflow-wrap: anywhere; }
      #shell { flex: 1; min-height: 22rem; min-width: 0; }
      #status:empty { display: none; }
    </style>
  </head>
  <body>
    <header>
      <h1>DuckDB CSV Explorer</h1>
      <p>Try <code>SELECT channel, SUM(views) FROM campaigns GROUP BY channel;</code></p>
      <p>Type <code>.files add</code> to open a local CSV or Parquet file. Type <code>.help</code> for shell commands.</p>
      <p id="status" role="status">Starting DuckDB…</p>
    </header>
    <main id="shell" aria-label="DuckDB SQL shell"></main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
