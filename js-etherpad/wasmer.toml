[package]
name = "wasmer-tests/wasmer-edge-etherpad-sample"
version = "0.1.0"
description = "Etherpad 3.3 collaborative editor running on EdgeJS on Wasmer Edge"

[dependencies]
"wasmer/edgejs-quickjs" = "0.0.8"

[fs]
"/app" = "./app"

[[command]]
name = "server"
module = "wasmer/edgejs-quickjs:edge"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["/app/src/node/server.js"]
cwd = "/app"
env = ["NODE_ENV=production", "HOME=/tmp"]
