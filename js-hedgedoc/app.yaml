---
kind: wasmer.io/App.v0
name: wasmer-edge-hedgedoc-sample
package: wasmer-tests/wasmer-edge-hedgedoc-sample
env:
  # Point this at your PostgreSQL database (required).
  CMD_DB_URL: postgres://user:password@your-db-host:5432/hedgedoc
  # Set this to a long random string (required).
  CMD_SESSION_SECRET: change-me
  CMD_ALLOW_ANONYMOUS: "true"
