# node_modules is shipped inside the Wasmer package, so it must contain real
# files rather than pnpm's default symlink layout.
nodeLinker: hoisted
allowBuilds:
  aws-sdk: false
  bufferutil: false
  core-js: false
  esbuild: false
  sqlite3: false
  utf-8-validate: false
# Upstream applies this patch via yarn's patch: protocol; replicate with pnpm.
patchedDependencies:
  passport@0.7.0: patches/passport@0.7.0.patch
# Stub image-upload backends that are only loaded when the corresponding
# CMD_IMAGE_UPLOAD_TYPE is configured; together they add >100 MB to the
# deployed package. Remove the override and reinstall if you need one.
overrides:
  aws-sdk: npm:empty-npm-package@1.0.0
  azure-storage: npm:empty-npm-package@1.0.0
  minio: npm:empty-npm-package@1.0.0
