[package]
name = "wasmer-tests/wasmer-edge-hedgedoc-sample"
version = "0.1.0"
description = "HedgeDoc 1.11 collaborative markdown editor running on EdgeJS on Wasmer Edge"

[dependencies]
"wasmer/edgejs-quickjs" = "0.0.8"

[fs]
"/app" = "./app"

[[command]]
name = "server"
module = "wasmer/edgejs-quickjs:edge"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["/app/app.js"]
cwd = "/app"
# CMD_TOOBUSY_LAG is raised because the QuickJS interpreter trips HedgeDoc's
# default event-loop-lag guard (70ms) right after boot, returning 503s.
env = [
    "CMD_HOST=0.0.0.0",
    "NODE_ENV=production",
    "CMD_TOOBUSY_LAG=10000",
    "HOME=/tmp",
]
