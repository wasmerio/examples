[package]
name = "wasmer/n8n"
version = "2.48.4"
description = "n8n workflow automation, prebuilt for Wasmer Edge"
license-file = "n8n/LICENSE.md"
entrypoint = "n8n"

[dependencies]
"wasmer/edgejs-quickjs" = "=0.2.5"

[fs]
"/n8n" = "./n8n"

[[command]]
name = "n8n"
module = "wasmer/edgejs-quickjs:edge"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
atom = "wasmer/edgejs-quickjs:edge"
main-args = ["/n8n/wasmer-start.cjs"]
