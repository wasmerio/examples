[package]
name = "wasmer-tests/wasmer-edge-umami-sample"
version = "0.1.0"
description = "Umami 3.2 web analytics (Next.js standalone + Prisma) running on EdgeJS on Wasmer Edge"

[dependencies]
"wasmer/edgejs-quickjs" = "0.0.8"

[fs]
"/app" = "./app/.next/standalone"

[[command]]
name = "server"
module = "wasmer/edgejs-quickjs:edge"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["/app/server.js"]
cwd = "/app"
env = ["HOSTNAME=0.0.0.0", "NODE_ENV=production", "HOME=/tmp"]
