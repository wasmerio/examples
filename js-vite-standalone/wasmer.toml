[package]
name = "wasmer-tests/wasmer-edge-vite-sample"
version = "0.1.0"
description = "Vite site served by a small Node.js server running on EdgeJS on Wasmer Edge"

[dependencies]
"wasmer/edgejs-quickjs" = "0.0.8"

[fs]
"/app" = "dist"

[[command]]
name = "server"
module = "wasmer/edgejs-quickjs:edge"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["/app/server/index.cjs"]
env = ["HOST=0.0.0.0", "NODE_ENV=production", "HOME=/tmp"]
