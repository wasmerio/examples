[project]
name = "wasmer-fastapi-sqlalchemy-starter"
version = "0.1.0"
description = "FastAPI + SQLAlchemy todo app for Wasmer Edge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "uvicorn>=0.38",
    "sqlalchemy>=2.0.44",
    "pymysql>=1.1.2",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = ["pytest>=8.4", "httpx>=0.28"]

[tool.pytest.ini_options]
pythonpath = ["."]
