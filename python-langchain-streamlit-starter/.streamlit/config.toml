[server]
headless = true
# Bind IPv4 explicitly; the Wasmer runtime does not support dual-stack IPv6 sockets.
address = "0.0.0.0"

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#171717"
backgroundColor = "#f0f2f7"
secondaryBackgroundColor = "#fbfbfc"
textColor = "#0f0518"
font = "sans serif"

[client]
toolbarMode = "minimal"
