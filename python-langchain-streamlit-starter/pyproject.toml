[project]
name = "wasmer-langchain-streamlit-starter"
version = "0.1.0"
description = "Streamlit chat app powered by LangChain, on Wasmer Edge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Streamlit 1.57+ serves through a socket the Wasmer runtime cannot listen on twice; 1.56 uses Tornado.
    "streamlit>=1.56,<1.57",
    "langchain-openai>=1.0",
]
