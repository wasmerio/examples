[project]
name = "wasmer-mcp-chatgpt-starter"
version = "0.1.0"
description = "MCP server with search and fetch tools for ChatGPT, on Wasmer Edge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "uvicorn>=0.38",
]

[dependency-groups]
dev = ["pytest>=8.4", "httpx>=0.28"]

[tool.pytest.ini_options]
pythonpath = ["."]
